/* ---- список «Оборудование на плане» ---- */
function planListHtml(CU){
  const on=CU.filter(u=>S.layout[u.key]).map(u=>({u, no:posNo(u)})).sort((a,b)=>(a.no||999)-(b.no||999)||a.u.c.n.localeCompare(b.u.c.n,'ru'));
  if(!on.length) return '';
  const open=VIEW.list==null?isTouch():VIEW.list;
  return `<details class="panel plist" id="plist" ${open?'open':''}><summary>Оборудование на плане <span class="num" style="letter-spacing:0">${on.length}</span></summary>
    <div class="plist-rows">${(()=>{ const row=x=>`<button type="button" class="plist-row" data-plist="${esc(x.u.key)}" aria-current="${selSet.has(x.u.key)}"><span class="pno" aria-label="позиция ${x.no||'—'}">${x.no||'—'}</span><span>${esc(x.u.c.n)} · <span class="num muted">${Math.round(x.u.c.w*1000)}×${Math.round(x.u.c.d*1000)}</span></span><span aria-hidden="true" class="muted">›</span></button>`;
      if(S.rooms.length<2) return on.map(row).join('');
      // несколько помещений — по помещениям
      return S.rooms.map(r=>{ const xs=on.filter(x=>P.roomOf[x.u.key]===r.id); return xs.length?`<div class="plist-room">${esc(r.name)} <span class="num muted">${xs.length}</span></div>${xs.map(row).join('')}`:''; }).join(''); })()}</div></details>`;
}

/* ---- перерисовать только поле (подписи под новый масштаб) ---- */
function refreshField(f){
  const box=fieldBox(f); if(!box) return;
  refreshPlan();
  lastCW[f]=box.clientWidth;
}
function svgRect(box){ const svg=box.querySelector('svg'); return svg?svg.getBoundingClientRect():null; }
// точка экрана (cx, cy) внутри поля остаётся над той же точкой плана
function anchorOf(box,cx,cy){ const r=svgRect(box); return r?{cx, cy, fx:(cx-r.left)/r.width, fy:(cy-r.top)/r.height}:null; }
function keepAnchor(box,a){ if(!a) return; const r=svgRect(box); if(!r) return;
  box.scrollLeft+= (r.left+a.fx*r.width)-a.cx; box.scrollTop+= (r.top+a.fy*r.height)-a.cy; }
function visCenter(box){ const r=box.getBoundingClientRect(), top=Math.max(r.top,0), bot=Math.min(r.bottom,window.innerHeight);
  return {x:r.left+box.clientLeft+box.clientWidth/2, y:bot>top?(top+bot)/2:r.top+box.clientHeight/2}; }
function setZoom(f,z,at){
  z=clampZ(z); const box=fieldBox(f);
  VIEW.zp=z; saveView();
  if(!box){ updateBars(f); return; }
  const c=at||visCenter(box), a=anchorOf(box,c.x,c.y);
  setPz(box,z);
  refreshField(f); keepAnchor(box,a); memoScroll(box); updateBars(f);
}
function stepZoom(f,dir){ const z=VZ(f), e=1e-6;
  const n=dir>0 ? ZSTEPS.find(s=>s>z+e) : [...ZSTEPS].reverse().find(s=>s<z-e);
  if(n!=null) setZoom(f,n); }
function fitZoom(f){
  const box=fieldBox(f); if(!box) return; const svg=box.querySelector('svg'); if(!svg) return;
  const vb=svg.viewBox.baseVal, asp=vb.height/vb.width, cw=box.clientWidth;
  let avail;
  if(fsField===f) avail=box.clientHeight;
  else { const nav=document.querySelector('nav.steps'), navB=nav?nav.getBoundingClientRect().bottom:0; let r=box.getBoundingClientRect();
    if(r.top<navB+4 || r.top>window.innerHeight*0.55){ window.scrollBy(0, r.top-navB-8); r=box.getBoundingClientRect(); }
    avail=window.innerHeight-r.top-16-2; }
  const z=clampZ(Math.min(1, avail/(cw*asp)));
  VIEW.zp=z; saveView(); setPz(box,z); refreshField(f);
  box.scrollLeft=0; box.scrollTop=0; memoScroll(box); updateBars(f);
}

/* ---- прокрутка поля: запоминаем, чтобы перерисовка её не сбрасывала ---- */
const boxScroll={};
function memoScroll(box){ boxScroll[box.id]={l:box.scrollLeft, t:box.scrollTop, step, cur:S.cur, z:box.style.getPropertyValue('--pz')}; }

/* ---- щипок двумя пальцами (только сенсорные экраны) ---- */
function bindPinch(box,f){
  if(box.__pinch) return; box.__pinch=true;
  let st=null;
  const d2=(a,b)=>Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY), mid=(a,b)=>({x:(a.clientX+b.clientX)/2, y:(a.clientY+b.clientY)/2});
  box.addEventListener('touchstart',e=>{
    if(e.touches.length===2){ e.preventDefault(); cancelHold(); const m=mid(e.touches[0],e.touches[1]);
      st={d:Math.max(10,d2(e.touches[0],e.touches[1])), z0:VZ(f), z:VZ(f), a:anchorOf(box,m.x,m.y)}; }
  },{passive:false});
  box.addEventListener('touchmove',e=>{
    if(e.touches.length!==2 || !st) return; e.preventDefault();
    const m=mid(e.touches[0],e.touches[1]); st.z=clampZ(st.z0*d2(e.touches[0],e.touches[1])/st.d);
    setPz(box,st.z);              // во время щипка — только ширина SVG, без перестройки
    if(st.a) keepAnchor(box,{cx:m.x, cy:m.y, fx:st.a.fx, fy:st.a.fy});
  },{passive:false});
  const end=e=>{ if(!st || e.touches.length>=2) return; const z=st.z; st=null;
    VIEW.zp=z; saveView();
    const c=visCenter(box), a=anchorOf(box,c.x,c.y); refreshField(f); keepAnchor(box,a); memoScroll(box); updateBars(f); };
  box.addEventListener('touchend',end,{passive:false}); box.addEventListener('touchcancel',end,{passive:false});
  box.addEventListener('contextmenu',e=>{ if(isTouch()) e.preventDefault(); });
}

/* ---- касание элемента плана: компьютер — сразу как раньше; телефон — просмотр или удержание 300 мс ---- */
let holdSt=null, dragOn=false, multiPick=false;   // multiPick — «Выбрать несколько» на телефоне
function cancelHold(){ if(holdSt){ clearTimeout(holdSt.timer); holdSt.cleanup(); holdSt=null; } }
function planGate(e, el, start, tap){
  const touch=e.pointerType!=='mouse' && isTouch();
  if(!touch){ start&&start(); return; }
  cancelHold();
  const x0=e.clientX, y0=e.clientY, pid=e.pointerId, h={moved:false, fired:false, timer:0};
  const cleanup=()=>{ window.removeEventListener('pointermove',mv); window.removeEventListener('pointerup',up); window.removeEventListener('pointercancel',up); if(holdSt===h) holdSt=null; };
  const mv=ev=>{ if(ev.pointerId!==pid||h.fired) return; if(Math.hypot(ev.clientX-x0, ev.clientY-y0)>8){ h.moved=true; clearTimeout(h.timer); cleanup(); } };
  const up=ev=>{ if(ev.pointerId!==pid) return; clearTimeout(h.timer); cleanup(); if(!h.moved && !h.fired && ev.type==='pointerup' && tap) tap(); };
  h.cleanup=cleanup;
  if(planEdit && start && el){
    h.timer=setTimeout(()=>{ h.fired=true; cleanup(); dragOn=true;
      try{ navigator.vibrate&&navigator.vibrate(10); }catch(_){}
      el.classList.add('hold-on');
      const stop=()=>{ dragOn=false; window.removeEventListener('pointerup',stop); window.removeEventListener('pointercancel',stop); };
      window.addEventListener('pointerup',stop); window.addEventListener('pointercancel',stop);
      start(); },300);
  }
  holdSt=h;
  window.addEventListener('pointermove',mv); window.addEventListener('pointerup',up); window.addEventListener('pointercancel',up);
}
// пока идёт перетаскивание по удержанию — страница и поле не прокручиваются
document.addEventListener('touchmove',e=>{ if(dragOn) e.preventDefault(); },{passive:false});

/* ---- выделить аппарат из списка: прокрутить к нему, мелкий — увеличить ---- */
function focusUnit(key){
  if(P.roomOf[key]&&S.rooms.some(r=>r.id===P.roomOf[key])) S.cur=P.roomOf[key]; selOne(key); render();
  const box=fieldBox('plan'); if(!box) return;
  const nav=document.querySelector('nav.steps'), navB=nav?nav.getBoundingClientRect().bottom:0, br0=box.getBoundingClientRect();
  if(br0.top<navB+4 || br0.top>window.innerHeight*0.5) window.scrollBy(0, br0.top-navB-8);
  let g=box.querySelector(`.it[data-key="${CSS.escape(key)}"]`); if(!g) return;
  let r=g.getBoundingClientRect();
  if(r.width<60){ const z=clampZ(VZ('plan')*(box.clientWidth/3)/Math.max(1,r.width)); setZoom('plan', z, {x:r.left+r.width/2, y:r.top+r.height/2});
    g=box.querySelector(`.it[data-key="${CSS.escape(key)}"]`); r=g.getBoundingClientRect(); }
  const br=box.getBoundingClientRect(), vc=visCenter(box);
  box.scrollLeft+= (r.left+r.width/2)-(br.left+box.clientLeft+box.clientWidth/2);
  box.scrollTop+= (r.top+r.height/2)-vc.y;
  memoScroll(box);
}

/* ---- план на весь экран: свой слой поверх приложения ---- */
function fsOpen(f){ fsField=f; render(); requestAnimationFrame(()=>fitZoom(f)); }
function fsClose(){ fsField=null; document.documentElement.classList.remove('pfs-lock'); render(); }
function applyFs(){
  const f=fsField, els=f?[...main.querySelectorAll(`[data-fs="${f}"]`)]:[], box=els.find(x=>x.classList.contains('plan-box'));
  if(!f||!box){ fsField=null; document.documentElement.classList.remove('pfs-lock'); return; }
  const ov=document.createElement('div'); ov.className='plan-fs'; ov.setAttribute('role','dialog'); ov.setAttribute('aria-modal','true');
  ov.setAttribute('aria-label', 'План на весь экран');
  const head=document.createElement('div'); head.className='pfs-head'; const foot=document.createElement('div'); foot.className='pfs-foot';
  for(const el of els){ if(el===box) continue; if(el.classList.contains('zbar')||el.classList.contains('plan-layers')||el.classList.contains('lay-menu')) head.appendChild(el); else foot.appendChild(el); }
  ov.append(head, box, foot); main.appendChild(ov);
  document.documentElement.classList.add('pfs-lock');
}

/* ---- после каждой отрисовки шага с планом ---- */
let lastPlanCtx='';
function planAfter(){
  document.body.classList.toggle('has-sheet', !!document.getElementById('psheet'));
  applyFs();
  const ctx=step+'|'+(step===1||(typeof planUnified==='function'&&planUnified())?'all':S.cur)+'|'+planMode, same=ctx===lastPlanCtx; lastPlanCtx=ctx;
  for(const f of ['plan']){ const box=fieldBox(f); if(!box) continue;
    if(isTouch()) bindPinch(box,f);
    box.addEventListener('scroll',()=>memoScroll(box),{passive:true});
    if(Math.abs(box.clientWidth-(lastCW[f]||0))>2) refreshField(f);   // ширина поля изменилась — подписи под неё
    const m=boxScroll[box.id]; if(same && m){ box.scrollLeft=m.l; box.scrollTop=m.t; }
  }
  const pl=document.getElementById('plist'); pl&&pl.addEventListener('toggle',()=>{ VIEW.list=pl.open; saveView(); });
}
for(const i of [1,2,5]){ const b0=bind[i]; bind[i]=()=>{ b0&&b0(); planAfter(); }; }
const goPrev=go; go=function(i){ if(fsField){ fsField=null; document.documentElement.classList.remove('pfs-lock'); } return goPrev(i); };

/* ---- меню слоёв ---- */
function handleLayMenu(e){
  const menu=main.querySelector('.lay-menu'); if(!menu) return;
  const toggle=menu.querySelector('.lay-tgl'), esc=e.type==='keydown'&&e.key==='Escape';
  if(e.type==='keydown'){
    if(!esc||!layMenuOpen) return;
    e.preventDefault(); e.stopImmediatePropagation(); layMenuOpen=false;
  } else if(e.target.closest('.lay-tgl')) layMenuOpen=!layMenuOpen;
  else { if(!layMenuOpen||e.target.closest('.lay-menu')) return; layMenuOpen=false; }
  menu.classList.toggle('open',layMenuOpen); toggle.setAttribute('aria-expanded',String(layMenuOpen));
  if(esc) toggle.focus();
}
document.addEventListener('click',handleLayMenu,true);
document.addEventListener('keydown',handleLayMenu,true);

/* ---- кнопки: масштаб, «Вписать», слои, правка, весь экран, карточка, список ---- */
main.addEventListener('click',e=>{
  const t=e.target.closest('[data-z],[data-pedit],[data-mpick],[data-fs-open],[data-fs-close],[data-layer],[data-sheet],[data-plist]'); if(!t) return;
  if(t.hasAttribute('data-mpick')){ multiPick=!multiPick; render(); toast(multiPick?'Касание аппарата добавляет его к выделению или убирает':'Касание выбирает один аппарат'); return; }
  if(t.dataset.z){ const f=t.dataset.zf||'plan', a=t.dataset.z;
    if(a==='+') stepZoom(f,1); else if(a==='-') stepZoom(f,-1); else if(a==='1') setZoom(f,1); else if(a==='fit') fitZoom(f); return; }
  if(t.hasAttribute('data-pedit')){ planEdit=!planEdit; if(!planEdit) multiPick=false; render(); toast(planEdit?'Правка: удерживайте палец на элементе и ведите':'Просмотр: касания ничего не сдвигают'); return; }
  if(t.dataset.fsOpen){ fsOpen(t.dataset.fsOpen); return; }
  if(t.dataset.fsClose){ fsClose(); return; }
  if(t.dataset.layer){ const k=t.dataset.layer;
    if(k==='zones'){ showZones=!showZones; VIEW.layers.zones=showZones; } else if(k==='need') VIEW.layers.need=!needOn(); else VIEW.layers[k]=!layerOn(k);
    saveView(); render(); return; }
  if(t.dataset.sheet){ if(t.dataset.sheet==='close'){ sel=null; render(); } else if(t.dataset.sheet==='edit'){ planEdit=true; render(); } return; }
  if(t.dataset.plist){ focusUnit(t.dataset.plist); return; }
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape'||e.defaultPrevented) return; const t=e.target;
  if(t&&/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
  if(document.getElementById('psheet')){ e.preventDefault(); sel=null; render(); return; }
  if(fsField){ e.preventDefault(); fsClose(); }
});
// ширина окна изменилась — подписи под новую ширину поля
let rsT=0; window.addEventListener('resize',()=>{ clearTimeout(rsT); rsT=setTimeout(()=>{ for(const f of ['plan']){ const b=fieldBox(f); if(b && Math.abs(b.clientWidth-(lastCW[f]||0))>2){ const c=visCenter(b), a=anchorOf(b,c.x,c.y); refreshField(f); keepAnchor(b,a); } } },150); });

</script>
