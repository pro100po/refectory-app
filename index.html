<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Кухня трапезной</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Макет: рабочий инструмент-мастер. Шаги сверху, лист чертёжной бумаги для плана, киноварь — как инициалы в богослужебных книгах */
:root{
  --paper:#f3f5f1; --sheet:#ffffff; --ink:#1d282d; --ink-2:#56646a; --rule:#d3dad5; --grid:#e8ece8; --grid-2:#cfd7d1;
  --accent:#a3301c; --accent-soft:#f4e3df; --steel:#2e5964; --steel-soft:#e1ecee;
  --ok:#2d7448; --warn:#a86a0c; --bad:#b2261d; --ok-soft:#e2f0e6; --warn-soft:#f6ecd9; --bad-soft:#f7e1df;
  --z-san:#8a5a9e; --z-store:#7d8c97; --z-cold:#3f78b2; --z-raw:#b9852a; --z-hot:#c24f2c; --z-ready:#4c8750; --z-serve:#2b8580; --z-wash:#5868ad;
  --p-gas:#d39a00; --p-sewer:#7a6250; --p-el:#6b6f2a;
  --f-disp:"Alegreya", "PT Serif", Georgia, serif;
  --f-body:"IBM Plex Sans", "Segoe UI", Roboto, Arial, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#141a1c; --sheet:#1b2326; --ink:#e3e8e5; --ink-2:#9aa8ac; --rule:#323e40; --grid:#212b2e; --grid-2:#2e393c;
  --accent:#e5785f; --accent-soft:#3a2420; --steel:#86b7c2; --steel-soft:#1f3135;
  --ok:#6fc28b; --warn:#e3aa4f; --bad:#f07f74; --ok-soft:#1c3125; --warn-soft:#352a17; --bad-soft:#3a1f1d;
  --z-san:#b98ccc; --z-store:#a3b1ba; --z-cold:#77a8dc; --z-raw:#dcae5a; --z-hot:#ea7f5c; --z-ready:#7fb883; --z-serve:#5cbab4; --z-wash:#8d9ce0;
  --p-gas:#f2c443; --p-sewer:#b89a83; --p-el:#c5c96b;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#141a1c; --sheet:#1b2326; --ink:#e3e8e5; --ink-2:#9aa8ac; --rule:#323e40; --grid:#212b2e; --grid-2:#2e393c;
  --accent:#e5785f; --accent-soft:#3a2420; --steel:#86b7c2; --steel-soft:#1f3135;
  --ok:#6fc28b; --warn:#e3aa4f; --bad:#f07f74; --ok-soft:#1c3125; --warn-soft:#352a17; --bad-soft:#3a1f1d;
  --z-san:#b98ccc; --z-store:#a3b1ba; --z-cold:#77a8dc; --z-raw:#dcae5a; --z-hot:#ea7f5c; --z-ready:#7fb883; --z-serve:#5cbab4; --z-wash:#8d9ce0;
  --p-gas:#f2c443; --p-sewer:#b89a83; --p-el:#c5c96b;
  color-scheme:dark }

*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font:15px/1.5 var(--f-body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.app{padding-block:18px 6px}
.head-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.save-state{font-size:12.5px;color:var(--ink-2);margin-top:3px;min-height:18px}
.save-state.bad{color:var(--bad);font-weight:600}
.store-bar{margin-top:8px}
.store-bar>div{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;border-left:3px solid var(--bad);background:var(--bad-soft);padding:8px 12px;border-radius:var(--r);font-size:14px;margin-bottom:6px}
.store-bar>div.info{border-left-color:var(--steel);background:var(--steel-soft)}
details.old-io{margin-top:6px}details.old-io summary{cursor:pointer;color:var(--ink-2);font-size:14px;min-height:44px;display:flex;align-items:center}
.kicker{font:500 11px/1.3 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
h1{font:700 clamp(24px,5vw,34px)/1.15 var(--f-disp);margin:2px 0 0;text-wrap:balance}
h1 input[type=text]{font:inherit;color:inherit;background:transparent;border:0;border-bottom:1px dashed var(--rule);border-radius:0;width:100%;padding:0 0 2px;min-width:0}
h1 input[type=text]:hover,h1 input[type=text]:focus-visible{border-bottom-color:var(--ink-2);outline:none}

nav.steps{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--rule)}
nav.steps .nav-in{display:flex;align-items:center;gap:8px}
nav.steps .row{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-block:6px;flex:1 1 auto;min-width:0}
nav.steps .undo{display:flex;gap:4px;flex:0 0 auto}
nav.steps .undo .btn{padding:5px 9px}
@media (max-width:600px){ nav.steps .undo .btn span{display:none} nav.steps .undo .btn{padding:5px 8px} }
nav.steps .step-arr{flex:0 0 44px;width:44px;height:44px;padding:0;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);font:400 26px/1 var(--f-body);border-radius:var(--r);cursor:pointer}
nav.steps .step-arr:hover:not(:disabled){border-color:var(--ink-2)}
nav.steps .step-arr:disabled{color:var(--ink-2);opacity:.4;cursor:default}
nav.steps .step-arr:focus-visible{outline:2px solid var(--steel);outline-offset:1px}
nav.steps .row.fl{-webkit-mask-image:linear-gradient(to right,transparent,#000 28px);mask-image:linear-gradient(to right,transparent,#000 28px)}
nav.steps .row.fr{-webkit-mask-image:linear-gradient(to left,transparent,#000 28px);mask-image:linear-gradient(to left,transparent,#000 28px)}
nav.steps .row.fl.fr{-webkit-mask-image:linear-gradient(to right,transparent,#000 28px,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(to right,transparent,#000 28px,#000 calc(100% - 28px),transparent)}
@media (max-width:480px){ nav.steps .nav-in{gap:6px} nav.steps .row button[aria-current="page"]{white-space:normal;max-width:100%;text-align:left;line-height:1.2} }
nav.steps .row::-webkit-scrollbar{display:none}
nav.steps button{flex:0 0 auto;border:0;background:transparent;color:var(--ink-2);font:500 14px var(--f-body);padding:8px 11px;border-radius:var(--r);cursor:pointer;white-space:nowrap}
nav.steps button .n{font-family:var(--f-mono);font-size:12px;margin-right:5px}
nav.steps button[aria-current="page"]{background:var(--sheet);color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}
nav.steps button[aria-current="page"] .n{color:var(--accent)}
nav.steps button:focus-visible{outline:2px solid var(--steel);outline-offset:1px}

main{padding-block:18px 48px}
h2{font:700 26px/1.15 var(--f-disp);margin:0 0 4px;text-wrap:balance}
h2::first-letter{color:var(--accent)}
.lead{color:var(--ink-2);max-width:68ch;margin:0 0 16px}
.step-head{margin:0 0 16px}.step-head .lead{margin:0}
@media (min-width:900px){ .step-head{display:flex;align-items:center}.step-head h2{white-space:nowrap;margin:0}.step-head .lead{min-width:0;max-width:none;flex:1;border-left:1px solid var(--rule);padding-left:16px;margin-left:16px;font-size:14px} }
h3{font:600 13px/1.3 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin:0 0 10px}
.stack{display:flex;flex-direction:column;gap:18px}
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:16px;min-width:0}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span,.lbl{font-size:13px;color:var(--ink-2)}
.field small{color:var(--ink-2);font-size:12px}
.req::after{content:" *";color:var(--accent)}
input[type=number],input[type=text],select,textarea{font:15px var(--f-body);color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:var(--r);padding:8px 10px;min-width:0;width:100%}
input[type=number]{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--steel);outline-offset:0;border-color:transparent}
input.err{border-color:var(--bad);background:var(--bad-soft)}
input[disabled]{opacity:.5}
textarea{font:12px/1.4 var(--f-mono);min-height:90px;resize:vertical}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--paper);border:1px solid var(--rule);border-radius:var(--r);padding:3px}
.seg button{flex:1 1 auto;border:0;background:transparent;color:var(--ink-2);font:500 13.5px var(--f-body);padding:7px 10px;border-radius:4px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--sheet);color:var(--ink);box-shadow:0 0 0 1px var(--rule)}
.seg button:focus-visible{outline:2px solid var(--steel)}
.check{display:flex;gap:9px;align-items:center;font-size:14.5px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--steel);flex:0 0 auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);font:500 14px var(--f-body);padding:8px 13px;border-radius:var(--r);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn:focus-visible{outline:2px solid var(--steel);outline-offset:1px}
.btn.primary{background:var(--steel);border-color:var(--steel);color:var(--sheet)}
.btn.danger{color:var(--bad)}
.btn.small{padding:5px 9px;font-size:13px}
.btn[aria-pressed="true"]{background:var(--steel-soft);border-color:var(--steel)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.plus{width:44px;height:44px;border-radius:50%;padding:0;font-size:24px;line-height:1;background:var(--steel);border-color:var(--steel);color:var(--sheet);flex:0 0 auto}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
.pager .btn{white-space:normal;text-align:center;min-width:0}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.example{font-size:13.5px;background:var(--steel-soft);color:var(--ink);border-radius:var(--r);padding:9px 12px;margin-bottom:16px}
.hint{font-size:13.5px;color:var(--ink-2);margin:0}

/* блюда */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.dish{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--rule);background:var(--paper);color:var(--ink-2);border-radius:20px;padding:7px 14px 7px 10px;font:500 14.5px var(--f-body);cursor:pointer}
.dish .bx{width:17px;height:17px;border-radius:4px;border:1.5px solid var(--ink-2);display:grid;place-items:center;font-size:12px;line-height:1;color:transparent}
.dish[aria-pressed="true"]{background:var(--steel-soft);border-color:var(--steel);color:var(--ink)}
.dish[aria-pressed="true"] .bx{background:var(--steel);border-color:var(--steel);color:var(--sheet)}
.dish:focus-visible{outline:2px solid var(--steel);outline-offset:1px}
.dish .x{margin-left:2px;color:var(--ink-2);font-size:16px;line-height:1}
.dish small{color:var(--ink-2);font-weight:400;font-size:12px}
.add-dish{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,190px) auto;gap:8px;margin-top:12px}
@media (max-width:560px){ .add-dish{grid-template-columns:1fr auto} .add-dish select{grid-column:1/-1;grid-row:2} }

.heat-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.heat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px}
.heat{border:1px solid var(--rule);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--paper);min-width:0}
.heat.on{background:var(--sheet);border-color:var(--steel)}
.heat-h{gap:8px;flex-wrap:wrap}
.heat-h b{font-weight:600}
.heat .hint{font-size:13px}
.heat-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.heat-row .seg{flex:1 1 200px}
.heat-meta{font-family:var(--f-mono);font-size:12px!important}
.seg button:disabled{opacity:.45;cursor:not-allowed;text-decoration:line-through}
.heat .seg button{min-height:38px}
.fuel-row .seg{flex:0 1 220px}
.check.gas-on{padding:0 12px;border:1px solid var(--rule);border-radius:var(--r);background:var(--sheet);font-weight:500;font-size:14px}
.gas-src{margin:12px 0 4px;max-width:520px}
.tap{min-height:44px}
.dish.tap{padding-block:9px}
.confirm-box{margin-top:10px;padding:10px 12px;border-radius:var(--r);border:1px solid var(--warn);background:var(--warn-soft);display:flex;flex-direction:column;gap:8px}
.confirm-box.neutral{border-color:var(--steel);background:var(--steel-soft)}
.confirm-box p{margin:0;font-size:14px;max-width:72ch}
/* сводка */
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px;margin-bottom:18px}
.meter{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:11px 13px;display:flex;flex-direction:column;gap:6px}
.meter .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.meter .v{font:500 19px var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.meter .v small{font-size:12px;color:var(--ink-2)}
.bar{position:relative;height:6px;border-radius:3px;background:var(--grid);overflow:visible}
.bar i{display:block;height:100%;background:var(--ok);border-radius:3px}
.bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)}
.bar b{position:absolute;top:-4px;width:2px;height:14px;background:var(--ink);border-radius:1px}
.state{font-size:12.5px}
.bar i.neutral{background:var(--steel)}
.bar b.mk-b{background:var(--steel)}
.mk-labels{position:relative;font:500 11.5px var(--f-mono);color:var(--ink-2);white-space:nowrap}
.mk-labels span{position:absolute;line-height:16px}
.mk-labels span.mk-b{color:var(--steel)}
.pmeter .btns{margin-top:2px}
.tap{min-height:44px}
.field-err{color:var(--bad)!important;font-size:12.5px!important}
.state.ok{color:var(--ok)} .state.warn{color:var(--warn)} .state.bad{color:var(--bad)}

.notes{display:flex;flex-direction:column;gap:6px;margin:0 0 16px;padding:0;list-style:none}
.notes li{font-size:14px;padding:8px 11px;border-radius:var(--r);border-left:3px solid var(--steel);background:var(--steel-soft)}
.notes li.warn{border-left-color:var(--warn);background:var(--warn-soft)}
.notes li.bad{border-left-color:var(--bad);background:var(--bad-soft)}
.notes li.ok{border-left-color:var(--ok);background:var(--ok-soft)}
.notes li[data-key]{cursor:pointer}
.panel .notes{margin:0}

/* список оборудования */
.zone-h{display:flex;align-items:center;gap:8px;font:600 13px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin:14px 0 4px}
.zone-h:first-child{margin-top:0}
.sw{width:11px;height:11px;border-radius:2px;flex:0 0 auto;display:inline-block}
.rows{display:flex;flex-direction:column}
.irow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--grid)}
.irow:first-child{border-top:0}
.irow .nm{font-size:14.5px;min-width:0}
.irow .nm .sub{display:block;font-size:12.5px;color:var(--ink-2)}
.irow .meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 12px;font:12px var(--f-mono);color:var(--ink-2)}
@media (min-width:700px){ .irow{grid-template-columns:minmax(0,1fr) 190px auto} .irow .meta{grid-column:auto;justify-content:flex-end} }
.tag{display:inline-block;font:500 11px var(--f-body);letter-spacing:.04em;padding:2px 7px;border-radius:10px;white-space:nowrap;background:var(--grid);color:var(--ink-2)}
.tag.have{background:var(--ok-soft);color:var(--ok)}
.tag.buy{background:var(--accent-soft);color:var(--accent)}
.tag.edit{background:var(--steel-soft);color:var(--steel);white-space:normal}
.irow .why{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12.5px;line-height:1.35;color:var(--ink-2);margin-top:2px}
.irow .etags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.irow .btns{flex-wrap:wrap;justify-content:flex-end}
.irow select.var{width:auto;max-width:100%;min-height:40px;padding:6px 8px;font-size:13.5px}
.irow .qty{font:500 13px var(--f-mono);color:var(--ink-2)}
.irow.pale .nmt,.irow.pale .why,.irow.pale .meta,.irow.pale .muted{opacity:.55}.irow.pale .nmt{text-decoration:line-through;text-decoration-color:var(--ink-2)}
@media (max-width:699px){ .irow.sel-row .btns{grid-column:1/-1;justify-content:flex-start} }
.edits-bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:8px 10px;margin:0 0 12px;border-radius:var(--r);background:var(--steel-soft);font-size:14px}
.add-row{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.add-row input{max-width:420px}
.add-pick{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.stepper button{border:0;background:var(--paper);color:var(--ink);width:32px;height:32px;font:500 17px var(--f-body);cursor:pointer}
.stepper span{min-width:30px;text-align:center;font:500 14px var(--f-mono)}
.add-head{display:flex;align-items:center;gap:12px}
.add-head span{font-weight:500}
.form{border-top:1px solid var(--rule);margin-top:14px;padding-top:14px}

/* план */
.plan-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.plan-tools .grow{margin-left:auto}
.plan-box{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y}
.plan-box svg{display:block;width:calc(var(--pz,1) * 100%);height:auto;margin:0 auto;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.plan-box.adding{cursor:crosshair;outline:2px dashed var(--steel);outline-offset:-2px}
svg .it,svg [data-op],svg [data-pt]{cursor:grab;touch-action:none}
svg .rm-bg,svg .rm-cfg{touch-action:none}
@media (pointer: coarse){ svg .it,svg [data-op],svg [data-pt],svg .rm-bg,svg .rm-cfg{touch-action:pan-x pan-y} }
svg text{font-family:var(--f-body)}
.sel-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;padding:10px 12px;background:var(--steel-soft);border-radius:var(--r)}
.sel-bar .nm{font-weight:600;flex:1 1 200px;min-width:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink-2);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .ln{width:18px;height:0;border-top:2px dashed var(--ink-2)}
.tray{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px dashed var(--ink-2);background:var(--sheet);color:var(--ink);border-radius:14px;padding:5px 11px;font:13px var(--f-body);cursor:pointer}
.pt-dot{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;color:#fff;font:700 10px var(--f-body);flex:0 0 auto}
.res{display:flex;flex-wrap:wrap;gap:6px}
.res span{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:3px 10px 3px 4px;border-radius:14px;background:var(--grid);color:var(--ink-2)}
.res span.on{background:var(--ok-soft);color:var(--ink)}
.chain-wall{padding:12px 0;border-top:1px solid var(--grid)}
.chain-wall:first-of-type{border-top:0;padding-top:0}
.chain-wall h4{margin:0 0 8px;font:600 14px var(--f-body);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.chain-wall h4 .num{font-weight:400;font-size:12.5px;color:var(--ink-2)}
.chain-row{padding:8px 10px;border-radius:var(--r);margin-bottom:6px;background:var(--paper)}
.chain-row[aria-current="true"]{background:var(--steel-soft)}
.chain-row .ttl{border:0;background:none;padding:0 0 6px;font:500 14px var(--f-body);color:var(--ink);cursor:pointer;text-align:left;display:flex;gap:8px;align-items:center}
.chain-row .ttl:focus-visible{outline:2px solid var(--steel)}
.chain-in{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.chain-in label{display:grid;grid-template-rows:1fr auto;align-items:end;gap:3px;font-size:12px;line-height:1.3;color:var(--ink-2);min-width:0}
.chain-in label.mid span{color:var(--ink);font-weight:500}
.chain-in.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.chain-in input{padding:7px 8px;font-size:14px}
@media (max-width:600px){ .chain-in.four{grid-template-columns:repeat(2,minmax(0,1fr))} } .chain-in.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.chain-in input.neg{border-color:var(--bad);background:var(--bad-soft)}
.olist{display:flex;flex-direction:column;margin-top:4px}
.olist button{display:flex;gap:10px;align-items:center;text-align:left;border:0;border-top:1px solid var(--grid);background:transparent;color:var(--ink);font:14px var(--f-body);padding:9px 2px;cursor:pointer}
.olist button:first-child{border-top:0}
.olist button[aria-current="true"]{background:var(--steel-soft)}
.olist .num{margin-left:auto;font-size:12.5px;color:var(--ink-2);text-align:right}

/* таблицы */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--grid);vertical-align:top}
th{font:600 12px var(--f-body);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);border-bottom-color:var(--rule)}
td.r,th.r{text-align:right}
td input[type=number]{width:120px;padding:5px 7px;font-size:13.5px}
.sum-line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--grid)}
.sum-line.total{font:700 20px var(--f-disp);border-top:2px solid var(--ink)}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;font-size:14px}
.kv .num{text-align:right}
.phase{display:grid;grid-template-columns:28px minmax(0,1fr) 70px;gap:8px;align-items:center;font-size:13px}
.checklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.checklist li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;font-size:14px}
.mk{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--f-body);color:var(--sheet)}
.mk.ok{background:var(--ok)} .mk.bad{background:var(--bad)} .mk.man{background:var(--ink-2)}
.norm{padding:12px 0;border-top:1px solid var(--grid)}
.norm:first-of-type{border-top:0;padding-top:0}
.norm b{font-weight:600}
.norm p{margin:4px 0 0;color:var(--ink-2);font-size:14px;max-width:72ch}
.status{display:inline-block;font:500 11px var(--f-body);padding:1px 7px;border-radius:10px;background:var(--ok-soft);color:var(--ok);margin-left:6px;vertical-align:1px}
.status.old{background:var(--warn-soft);color:var(--warn)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:20px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
footer.foot{font-size:12.5px;color:var(--ink-2);padding-block:0 32px;max-width:76ch}
/* имеющееся оборудование */
.ex-wide{grid-column:1/-1}
.ex-cat{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px 14px;padding:12px;border-radius:var(--r);background:var(--steel-soft)}
.ex-cat .hint{grid-column:1/-1}
.ex-eff{display:block;font-size:13px;margin-top:3px;line-height:1.35}
.ex-eff.ok{color:var(--ok)} .ex-eff.warn{color:var(--warn);font-weight:600} .ex-eff.info{color:var(--steel)} .ex-eff.muted{color:var(--ink-2)}
.irow.ex-norole{background:var(--warn-soft);border-radius:var(--r);padding-inline:10px;border-top-color:transparent;margin-block:4px}
.ex-rec{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:8px 10px;border-left:3px solid var(--steel);background:var(--steel-soft);border-radius:var(--r);font-size:13.5px}
.ex-row .stepper button{width:44px;height:44px}
.ex-form select,.ex-form input[type=text],.ex-form input[type=search]{min-height:44px}
.ex-form .seg button{min-height:44px}
.ex-form .check{min-height:44px}
.ex-more{margin-top:12px;border-top:1px solid var(--grid);padding-top:4px}
.ex-more>summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:500;color:var(--ink-2)}
/* «Слив до выпуска»: на телефоне — строкой под названием, а не отдельным столбцом */
.wtab .drm{display:none}
@media (max-width:600px){ .wtab .drc{display:none} .wtab .drm{display:block;font-size:12.5px;color:var(--ink-2);margin-top:2px} }
/* «уже есть» в карточке теплового */
.heat-have{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 10px;border-radius:var(--r);font-size:13.5px;line-height:1.4;background:var(--ok-soft);border-left:3px solid var(--ok)}
.heat-have.warn{background:var(--warn-soft);border-left-color:var(--warn)}
.heat-have .hh-t{flex:1 1 100%;min-width:0}
.heat-have .btns{gap:6px}
.heat-have .btn{white-space:normal;text-align:left}
.heat-have .hh-t .tag{margin-right:4px;vertical-align:1px}
.heat-have .link-btn{background:transparent;border-color:transparent;color:var(--steel);text-decoration:underline;text-underline-offset:3px;padding-inline:6px}
/* панель «Типовой набор изменит» */
.hrec{margin:10px 0 14px}
.hrec-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.hrec-list .check{min-height:44px;align-items:center}
.hrec-err{color:var(--bad)!important;font-weight:600}
@media (max-width:480px){ .hrec .btns .btn{flex:1 1 100%} }
/* исполнение теплового: сетка 2 колонки одинаковой ширины во всех карточках; последняя нечётная — в левой колонке, не растягивается.
   Самая длинная подпись («10 л, около 60 порций») помещается без переноса, когда карточка не уже ≈ 380 px: поэтому карточек
   в ряду не больше двух (от 900 px), а на узком экране все переключатели сразу переходят в одну колонку (до 480 px) */
.heat-grid{grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){ .heat-grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
.heat-row:not(.fuel-row) .seg{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;flex:1 1 100%;min-width:0}
@media (min-width:480px){ .heat-row:not(.fuel-row) .seg{grid-template-columns:repeat(2,minmax(0,1fr))} }
.heat-row:not(.fuel-row) .seg button{white-space:nowrap;text-align:center;min-height:44px;padding:7px 8px;min-width:0}
/* значок на вкладке шага: число ошибок (красный) или замечаний (жёлтый) */
nav.steps button .sb-nw{white-space:nowrap}   /* значок не отрывается от последнего слова, когда активная вкладка переносится */
nav.steps button .sbadge{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;padding:0 4px;margin:-4px 0 -4px 6px;border-radius:8px;font:700 10.5px/1 var(--f-body);color:var(--sheet);vertical-align:middle}
nav.steps button .sbadge.bad{background:var(--bad)}
nav.steps button .sbadge.warn{background:var(--warn)}
.step-iss{margin:0 0 14px;border-radius:var(--r);border-left:3px solid var(--warn);background:var(--warn-soft);padding:0 12px}
.step-iss.bad{border-left-color:var(--bad);background:var(--bad-soft)}
.step-iss>summary{cursor:pointer;min-height:44px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;list-style:none}
.step-iss>summary::-webkit-details-marker{display:none}
.step-iss>summary::before{content:"▸";display:inline-block;transition:transform .15s}
.step-iss[open]>summary::before{transform:rotate(90deg)}
.step-iss .notes{margin:0 0 12px}
/* шапка: ↶ ↷ — значки 44×44; «⚙ Настройки расчёта» */
nav.steps .undo .btn.icon-only{width:44px;height:44px;padding:0;font-size:20px;line-height:1}
nav.steps .undo #set-open{min-height:44px;gap:6px}
nav.steps .undo #set-open .set-ic{font-size:17px;line-height:1}
nav.steps .undo #set-open .set-l{display:inline}
#set-badge.sbadge{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;padding:0 4px;border-radius:8px;font:700 10.5px/1 var(--f-body);color:var(--sheet)}
#set-badge.sbadge.bad{background:var(--bad)} #set-badge.sbadge.warn{background:var(--warn)}
@media (max-width:640px){ nav.steps .undo #set-open{width:44px;padding:0;position:relative} nav.steps .undo #set-open .set-l{display:none}
  nav.steps .undo #set-open #set-badge.sbadge{position:absolute;top:3px;right:2px} }
/* телефон: кнопки ↶ ↷ ⚙ PDF — отдельной строкой под лентой, чтобы лента шагов не сжималась до нуля */
@media (max-width:480px){ nav.steps .nav-in{flex-wrap:wrap;row-gap:0} nav.steps .row{flex:1 1 0} nav.steps .undo{flex:1 1 100%;justify-content:flex-end;gap:4px;padding-bottom:4px} nav.steps .undo #rep-open{min-width:44px;min-height:44px;padding:0} }
@media (max-width:600px){ nav.steps .undo .btn.icon-only{padding:0} nav.steps .undo .btn.icon-only span, nav.steps .undo #set-open .set-ic{display:inline} nav.steps .undo #set-open #set-badge.sbadge{display:inline-flex} }
/* панель «Настройки расчёта»: справа поверх приложения; до 640 px — во весь экран */
.set-ov{position:fixed;inset:0;z-index:50;background:rgba(20,28,32,.45);display:flex;justify-content:flex-end}
html.set-lock,html.set-lock body{overflow:hidden}
.set-pnl{background:var(--sheet);color:var(--ink);border-left:1px solid var(--rule);box-shadow:-10px 0 40px rgba(0,0,0,.25);width:min(480px,100%);height:100%;display:flex;flex-direction:column}
.set-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:16px 18px 12px;border-bottom:1px solid var(--rule)}
.set-top h2{margin:0;font:600 22px var(--f-disp)}
.set-sub{margin:4px 0 0;font-size:13.5px;color:var(--ink-2)}
.set-body{flex:1 1 auto;overflow:auto;padding:4px 18px 24px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.set-sec{padding:14px 0;border-top:1px solid var(--grid)}
.set-sec:first-child{border-top:0}
.set-sec h3{margin:0 0 8px}
.set-g{margin:16px 0 8px;font:600 14px var(--f-body);color:var(--ink)}
.set-fields{grid-template-columns:minmax(0,1fr)}
@media (min-width:430px){ .set-fields{grid-template-columns:repeat(2,minmax(0,1fr))} }
.set-f{min-width:0;display:flex;flex-direction:column;gap:4px;border-radius:var(--r)}
.set-f.set-wide{grid-column:1/-1}
.set-f .check{min-height:44px}
.set-ch{display:flex;align-items:center;gap:6px}
.set-ch[hidden]{display:none}
.set-rs{width:44px;height:32px;min-height:32px;border:1px solid var(--rule);background:var(--paper);color:var(--steel);border-radius:var(--r);font-size:17px;cursor:pointer;padding:0}
@media (pointer:coarse){ .set-rs{height:44px} }
.set-rs:focus-visible{outline:2px solid var(--steel);outline-offset:1px}
.set-flash{outline:2px solid var(--steel);outline-offset:4px;background:var(--steel-soft)}
.set-reset .btn{min-height:44px}
@media (max-width:640px){ .set-pnl{width:100%;border-left:0} }
.linkish{border:0;background:none;padding:0;font:inherit;color:var(--steel);text-decoration:underline;text-underline-offset:3px;cursor:pointer;display:inline}
.linkish:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
@media (pointer:coarse){ .linkish{padding:10px 0;margin:-10px 0} }
/* одно помещение: строка вместо общего плана */
/* шаг «Помещения»: панель инструментов над планом */
.plan-bar-actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;min-width:0}
.plan-bar-actions .rt-g{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.plan-bar-actions .btn{min-height:44px}
.rooms-field .notes{margin-top:12px}
.rooms-hint{margin-top:8px}
.rm-cfg{cursor:pointer}
.rm-cfg:focus{outline:none}
.rm-cfg:focus-visible circle,.rm-cfg:hover circle{stroke:var(--steel);fill:var(--steel-soft)}
/* боковая панель помещения: немодальная, справа; от 1100 px — рядом с планом, уже — поверх его правой части, до 640 px — снизу */
.rmp-side{position:fixed;z-index:32;right:0;top:var(--rp-top,0px);bottom:0;width:min(400px,100%);background:var(--sheet);color:var(--ink);border-left:1px solid var(--rule);box-shadow:-8px 0 30px rgba(0,0,0,.16);display:flex;flex-direction:column}
.rmp-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;border-bottom:1px solid var(--rule)}
.rmp-top h2{margin:0;font:600 20px var(--f-disp);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rmp-top .btn{min-height:44px;flex:0 0 auto}
.rmp-body{flex:1 1 auto;overflow:auto;padding:0 16px 24px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.rmp-sec{padding:14px 0;border-top:1px solid var(--grid)}
.rmp-sec:first-child{border-top:0}
.rmp-sec h3{margin:0 0 10px}
.rmp-fields{grid-template-columns:repeat(2,minmax(0,1fr))}
.rmp-wide{grid-column:1/-1}
.rmp-warn{margin:8px 0 0;padding:8px 10px;border-left:3px solid var(--warn);background:var(--warn-soft);border-radius:var(--r);font-size:13.5px}
.shp-controls{display:flex;flex-direction:column;gap:12px}
.shp-template-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;align-items:stretch}
.shp-template{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:3px;min-width:0;min-height:64px;padding:5px 3px;font-size:12.5px;line-height:1.15;white-space:normal;overflow-wrap:anywhere}
.shp-handle{touch-action:none}
.shp-template[aria-pressed="true"],.shp-rot[aria-pressed="true"]{background:var(--steel-soft);border-color:var(--steel);color:var(--ink)}
.shp-svg{width:40px;height:28px;flex:0 0 auto}
.shp-custom-label{grid-column:1/-1;align-self:center;color:var(--ink-2);font-size:13px}
.shp-rotation{display:flex;flex-direction:column;gap:6px}
.shp-rot-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.shp-rot{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:0;min-height:58px;padding:3px;font-size:12px}
.shp-fields{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.shp-wall-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.shp-wall-actions .hint{margin-right:2px}
.shp-wall-list{display:flex;flex-direction:column}
.shp-wall-row{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:8px;align-items:end;padding:8px 0;border-top:1px solid var(--grid)}
.shp-wall-row>b{align-self:center;font-size:13px;font-weight:500}
.shp-wall-row .field{min-width:0}
.shp-action{min-height:44px;white-space:normal;line-height:1.15}
.shp-step{display:flex;flex-direction:column;gap:10px;padding-top:12px;border-top:1px solid var(--grid)}
.shp-step h4{margin:0;font-size:14px}
.shp-step .field{min-width:0}
@media (max-width:640px){ .shp-step .shp-fields{grid-template-columns:minmax(0,1fr)} }
.shp-error-slot:empty{display:none}
.rmp-note{display:block;margin-top:8px;font-size:12.5px;color:var(--ink-2)}
.rmp-side .chain-row .ttl{min-height:44px;padding-bottom:4px}
.rmp-side .chain-in.four{grid-template-columns:repeat(2,minmax(0,1fr))}
.rmp-side #rpanel{margin:0 0 10px!important;padding:12px;border:1px solid var(--steel);box-shadow:none}
.rmp-side #rpanel .fields{grid-template-columns:minmax(0,1fr)}
.rmp-side .btn{min-height:44px}
.rmp-foot{display:none}
@media (min-width:1100px){ html:has(#rmp-side) main.wrap{margin-left:max(0px,calc((100vw - 416px - 1080px) / 2));margin-right:416px} }
@media (max-width:640px){
  .rmp-side{top:auto;left:0;width:100%;height:60vh;height:60dvh;border-left:0;border-top:1px solid var(--rule);border-radius:14px 14px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.2)}
  .rmp-top #rmp-close{display:none}
  .rmp-foot{display:flex;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--rule)}
  .rmp-foot .btn{flex:1 1 auto}
  html:has(#rmp-side) main{padding-bottom:62vh} }
@media (max-width:390px){ .shp-fields{grid-template-columns:minmax(0,1fr)} .shp-template-row{grid-template-columns:repeat(3,minmax(0,1fr))} .shp-custom-label{grid-column:1/-1;justify-self:end} }
/* окно «Новое помещение» */
.nr-dlg{width:min(600px,100%)}
.nr-fields{grid-template-columns:repeat(2,minmax(0,1fr))}
.nr-wide{grid-column:1/-1}
.nr-dlg .dish,.nr-dlg .btn,.nr-dlg select,.nr-dlg input{min-height:44px}
/* палитра точек: кружок с обозначением и название; до 640 px — только кружки в один ряд с прокруткой внутри */
.pt-pal{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0;max-width:100%}
.pt-pal .btn{min-height:44px;gap:8px;padding:6px 12px 6px 8px}
.pt-pal .pt-dot{width:26px;height:26px;font-size:10.5px;letter-spacing:-.02em}
.pt-pal .btn[aria-pressed="true"]{box-shadow:inset 0 0 0 1px var(--steel)}
.pt-pal .pt-hood{padding-inline:14px}
.pt-pal.compact .pt-pb{flex:0 0 44px;width:44px;padding:0;justify-content:center} .pt-pal.compact .pt-pn{display:none}
/* строка над планом: слева слои, справа масштаб; не помещается — масштаб переносится под слои, прижатым вправо */
.plan-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:10px}
.plan-bar>.plan-layers{margin:0;flex:0 1 auto;min-width:0}
.plan-bar>.zbar{margin-left:auto}
@media (max-width:899px){ .plan-bar-actions{order:-1;flex:0 0 100%} }
@media (min-width:900px){ .plan-bar .plan-layers .btn,.plan-bar-actions>.btn,.plan-bar-actions .rt-g>.btn,.plan-bar>.zbar>.btn{padding-inline:5px;font-size:13px} }
/* переключатель «Сети есть / проектируем»: на телефоне — в две строки */
.nets-panel .seg button{min-height:44px;white-space:normal;line-height:1.25}
@media (max-width:640px){ .nets-panel .seg{flex-direction:column} }
.nets-panel .notes{margin-top:10px}
.nets-inline{display:flex;align-items:center;gap:8px}
.nets-inline .seg button{min-height:44px;white-space:nowrap}
.pt-pal-row{margin-bottom:10px}
@media (min-width:900px){ .nets-panel{display:none} .points-tools>.plan-bar>.lay-menu{margin-left:auto} .points-tools>.plan-bar>.zbar{margin-left:0} }
@media (max-width:899px){ .nets-inline,.nets-inline-info{display:none} .points-tools{display:flex;flex-direction:column} .points-tools>.pt-pal-row{order:-1} }
/* резерв и полоса «Убрать в резерв» */
.tray .chip{min-height:44px;padding:8px 14px;touch-action:auto;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.tray .chip.rsv-src{opacity:.5}

  for(const p of pl) if(me(p) && !(posAng(L[p.u.key])?unitInRoom(s.room,p.u.c,L[p.u.key]):rectInRoom(s.room,p.b))) iss.push({t:'bad', key:p.u.key, lbl:'Выходит за стену', m:`«${nm(p.u)}» выходит за стены помещения.`});
  for(const p of fl){ if(!me(p)) continue;
    for(const o of prots) if(hitX(p,protRect(s,o))) iss.push({t:'bad', key:p.u.key, lbl:'Упирается в выступ', m:`«${nm(p.u)}» упирается в выступ стены.`});
    for(const o of doors) if(hitX(p,doorBlock(s,o))) iss.push({t:'bad', key:p.u.key, lbl:'Загораживает дверь', m:`«${nm(p.u)}» загораживает дверь ${doorLabel(o)}.`});
    for(const o of wins){ if(p.u.c.h<=(o.sill||0.9)+0.01) continue;
      if(hitX(p,bandOf(s,o,0.35))) iss.push({t:'bad', key:p.u.key, lbl:'Перекрывает окно', m:`«${nm(p.u)}» высотой ${fmt0(p.u.c.h*1000)} мм перекрывает окно (подоконник ${fmt0((o.sill||0.9)*1000)} мм). Под окном допустимы только столы и низкое оборудование.`});
      else if(hitX(p,bandOf(s,{side:o.side,off:o.off-0.08,w:o.w+0.16},0.35))) iss.push({t:'bad', key:p.u.key, lbl:'Вплотную к окну', m:`«${nm(p.u)}» ближе 80 мм к краю окна — высокое оборудование не ставят вплотную к проёму.`});
      else if(hitX(p,bandOf(s,{side:o.side,off:o.off-0.12,w:o.w+0.24},0.35))) iss.push({t:'warn', key:p.u.key, lbl:'Близко к окну', m:`«${nm(p.u)}» ближе 120 мм к краю окна. Отступ до 80 мм допустим, только если иначе расстановка не помещается.`}); }
    if(p.a){ if(!polyInRoom(s.room,p.FP)) iss.push({t:'warn', key:p.u.key, lbl:'Мало места перед фронтом', m:`Перед «${nm(p.u)}» рабочая зона упирается в стену — отодвиньте соседнее оборудование или аппарат.`}); }
    else if(rectInRoom(s.room,p.b) && !rectInRoom(s.room,p.f)){
      if(roomWalls(s.room).some(w=>!w.axis && segHitsRect(w.x1,w.y1,w.x2,w.y2,p.f))) iss.push({t:'warn', key:p.u.key, lbl:'Мало места перед фронтом', m:`Перед «${nm(p.u)}» рабочая зона упирается в косую стену — отодвиньте аппарат от неё.`});
      else iss.push({t:'warn', key:p.u.key, lbl:'Фронтом к стене', m:`«${nm(p.u)}» развёрнут фронтом к стене.`});
    }
  }
  for(let i=0;i<fl.length;i++) for(let j=i+1;j<fl.length;j++){
    const a=fl[i], b=fl[j]; if(one && a.u.key!==key && b.u.key!==key) continue;
    const oth=a.u.key===key?b:a, pg=()=>`Проход ${fmtM(gapX(a,b))}`;
    if(hitX(a,b)){ iss.push({t:'bad', key:a.u.key, lbl:`Наложение на ${sn(oth.u)}`, m:`«${nm(a.u)}» и «${nm(b.u)}» наложены друг на друга.`}); continue; }
    if(hitX(a,b,true)) iss.push({t:'warn', key:a.u.key, lbl:pg(), m:`Перед «${nm(a.u)}» меньше ${fmtM(workDepth(s,a.u.c))} для работы: мешает «${nm(b.u)}».`});
    else if(hitX(b,a,true)) iss.push({t:'warn', key:b.u.key, lbl:pg(), m:`Перед «${nm(b.u)}» меньше ${fmtM(workDepth(s,b.u.c))} для работы: мешает «${nm(a.u)}».`});
    else if(facingX(a,b) && hitX(a,b,true,true)){ const g=gapX(a,b);
      if(g<s.norms.passage) iss.push({t:'warn', key:a.u.key, lbl:`Проход ${fmtM(g)}`, m:`Проход между «${nm(a.u)}» и «${nm(b.u)}» — ${fmtM(g)}, при двух рабочих местах лицом друг к другу удобно не меньше ${fmtM(s.norms.passage)}.`}); }
    const hc=(x,y)=>x.u.c.hot && (y.u.c.z==='cold'||y.u.c.role==='coldtable');
    if((hc(a,b)||hc(b,a)) && gapX(a,b)<0.3) iss.push({t:'warn', key:(a.u.c.hot?b:a).u.key, lbl:oth.u.c.hot?'Вплотную к тепловому':'Вплотную к холодильному', m:`Холодильное «${nm(a.u.c.hot?b.u:a.u)}» стоит вплотную к тепловому — нужен зазор от 0,3 м или теплоизоляционный экран.`});
    const raw=r=>['tableRaw','tableMeat','tableFish','bathRaw','bathMeat','bathFish'].includes(r), ready=r=>['tableReady','serveTable','marmit','coldtable'].includes(r);
    if(s.norms.strict && ((raw(a.u.c.role)&&ready(b.u.c.role))||(raw(b.u.c.role)&&ready(a.u.c.role))) && gapX(a,b)<0.5)
      iss.push({t:'warn', key:a.u.key, lbl:'Сырое рядом с готовым', m:`«${nm(a.u)}» и «${nm(b.u)}» рядом: сырая и готовая продукция не должны пересекаться — разнесите их по ходу технологического потока.`});
  }
  for(const p of wl){ if(!me(p)) continue;
    const dw=Math.min(...roomWalls(s.room).map(w=>backGap(s.room,w,p.b)));
    if(dw>0.05 && !(p.a&&L[p.u.key].sw)) iss.push({t:'warn', key:p.u.key, lbl:'Не у стены', m:`Настенное «${nm(p.u)}» не у стены — его нужно повесить на стену.`});
    for(const o of s.openings.filter(o=>o.type!=='prot'||isProt(o))){ if(isProt(o)){ if(hitX(p,protRect(s,o))) iss.push({t:'bad', key:p.u.key, lbl:'Упирается в выступ', m:`Настенное «${nm(p.u)}» упирается в выступ стены.`}); } else if(hitX(p,bandOf(s,o,0.6))) iss.push({t:'bad', key:p.u.key, lbl:o.type==='door'?'Висит на двери':'Висит на окне', m:`Настенное «${nm(p.u)}» висит на ${o.type==='door'?'двери':'окне'}.`}); }
  }
  for(let i=0;i<wl.length;i++) for(let j=i+1;j<wl.length;j++) if((!one||wl[i].u.key===key||wl[j].u.key===key) && hitX(wl[i],wl[j])) iss.push({t:'bad', key:wl[i].u.key, lbl:`Наложение на ${sn((wl[i].u.key===key?wl[j]:wl[i]).u)}`, m:`Настенные «${nm(wl[i].u)}» и «${nm(wl[j].u)}» наложены.`});
  const gas=s.points.filter(p=>p.type==='gas');
  if(gas.length) for(const p of pl){ if(!p.u.c.gas||!me(p)) continue;
    const d=Math.min(...gas.map(g=>ptDist(s,p.b,g)));
    if(d>s.norms.gasHose+0.01) iss.push({t:'info', key:p.u.key, lbl:'Далеко от газа', m:`Газовое «${nm(p.u)}» в ${fmtM(d)} от точки газа — дальше гибкой подводки (${fmtM(s.norms.gasHose)}). Газопровод нужно продлить до аппарата: это работа газовой службы, чуть сложнее, но обычное дело.`}); }
  // электрощит: перед ним — только столы, нейтральное и холодильный стол до elPanelLowH; вода — не ближе elWaterDist
  { const n=elN(s), lowmm=fmt0(n.h*1000)+' мм';
    for(const q of elPanels(s)){ const Z=elZone(s,q), P0=wallPt(s,q);
      for(const x of pl){ if(!me(x)) continue; const c=x.u.c;
        if(hitX(x,Z)){
          if(!elOkKind(c)) iss.push({t:'bad', key:x.u.key, lbl:'Перед электрощитом', m:`Перед электрощитом стоит «${nm(x.u)}» — здесь допустимы только столы, нейтральное оборудование и холодильный стол до ${lowmm}.`});
          else if((c.h||0)>n.h+1e-6) iss.push({t:'bad', key:x.u.key, lbl:'Закрывает электрощит', m:`Перед электрощитом «${nm(x.u)}» высотой ${fmt0(c.h*1000)} мм — закрывает щит; допустимо до ${lowmm}.`});
          continue; }
        if(elWater(c)){ const d=gapX(x,P0); if(d<n.wd-1e-6) iss.push({t:'bad', key:x.u.key, lbl:`Вода в ${fmt1(d)} м от щита`, m:`${c.lb||nm(x.u)} в ${fmt1(d)} м от электрощита — источники воды не ближе ${fmtM(n.wd)}.`}); } }
      if(!one) for(const w of s.points){ if(w.type!=='cw'&&w.type!=='hw') continue; const d=gap(wallPt(s,w),P0);
        if(d<n.wd-1e-6) iss.push({t:'bad', m:`Ввод ${w.type==='cw'?'холодной':'горячей'} воды в ${fmt1(d)} м от электрощита — перенесите кран или щит не ближе ${fmtM(n.wd)}.`}); } } }
  // газовый кран и розетки: аппарат у этой стены (ближе 0,3 м), перекрывает точку вдоль стены (±0,15 м)
  for(const q of s.points){ if((q.type!=='gas'&&q.type!=='sock')||!q.side||q.side==='floor') continue;
    const sd=q.side, gasQ=q.type==='gas';
    const at=pl.filter(x=>{ const dist=unitWallDist(s.room,sd,x.u.c,L[x.u.key]);
      if(dist>0.3+1e-6) return false; const [a0,a1]=unitWallSpan(s.room,sd,x.u.c,L[x.u.key]);
      return a1>=q.off-0.15-1e-6 && a0<=q.off+0.15+1e-6; });
    if(!at.length || (one && !at.some(x=>x.u.key===key))) continue;
    const wallU=gasQ?null:at.find(x=>x.u.c.mount==='wall'), fl2=at.filter(x=>x.u.c.mount==='floor').sort((a,b)=>b.u.c.h-a.u.c.h);
    const hi=q.hgt!=null?fl2.find(x=>x.u.c.h>q.hgt+1e-6):null;
    const mine=x=>!one||x.u.key===key;
    if(wallU){ if(mine(wallU)) iss.push({t:'warn', key:wallU.u.key, pt:true, lbl:'Закрывает розетку', m:`Розетка закрыта «${nm(wallU.u)}» — настенное оборудование висит на месте розетки.`}); }
    else if(hi){ if(mine(hi)) iss.push({t:'warn', key:hi.u.key, pt:true, lbl:gasQ?'Закрывает газовый кран':'Закрывает розетку', m:gasQ?`Газовый кран закрыт «${nm(hi.u)}» — его нужно перекрывать быстро; поставьте кран выше или сдвиньте аппарат.`:`Розетка закрыта «${nm(hi.u)}» — оборудование выше розетки.`}); }
    else if(q.hgt==null && fl2.length){ if(mine(fl2[0])) iss.push({t:'info', key:fl2[0].u.key, pt:true, m:gasQ?`Газовый кран за «${nm(fl2[0].u)}» — укажите высоту крана, чтобы проверить доступ.`:`Розетка за «${nm(fl2[0].u)}» — укажите высоту, чтобы проверить.`}); }
  }
  // слив до выпуска канализации: вдоль стен, двери не пересекаются; выпуск в полу — по прямой
  { const dl=pl.filter(x=>hasDrain(x.u.c)&&me(x));
    if(dl.length){ const outs=s.points.filter(p=>p.type==='sewer'), mx=swMax(s);
      if(!outs.length){ if(!one && typeof S!=='undefined' && S && S.rooms && !netsDesign(S) && hasPt(S,'sewer')) iss.push({t:'warn', sw:true, m:`В «${roomName(S,s.id)}» нет выпуска канализации — отметьте его на шаге «Подключения».`}); }
      else for(const x of dl){ const r=sewerRoute(s,x.u,L); if(!r) continue; const nmS=swName(x.u.c);
        if(r.blocked) iss.push({t:'bad', key:x.u.key, sw:true, lbl:'Слив не провести', m:`${nmS}: до выпуска канализации не провести слив — путь вдоль стен перекрывают двери.`});
        else if(r.len>mx+1e-6) iss.push({t:'warn', key:x.u.key, sw:true, lbl:`Слив ${fmt1(r.len)} м`, m:`${nmS}: слив до канализации ${fmt1(r.len)} м ${r.via==='floor'?'по полу':'по стенам'} — больше ${fmtM(mx)}; придвиньте ${swWash(x.u.c)?'мойку':'аппарат'} к выпуску или добавьте выпуск.`}); } } }
  const hg=one?0:hotGroups(s,units,L);
  if(hg>1) iss.push({t:'warn', m:`Тепловое оборудование разнесено на ${hg} ${plural(hg,'группу','группы','групп')} — понадобится ${hg} ${plural(hg,'зонт','зонта','зонтов')}. Поставьте пароконвектомат, плиту и котёл в одну линию, чтобы закрыть их одним зонтом.`});
  const un=one?0:units.filter(u=>!L[u.key]).length;
  if(un) iss.push({t:'info', m:`${un} ${plural(un,'позиция','позиции','позиций')} пока не на плане — они в резерве, под планом.`});
  const seen=new Set(); return iss.filter(x=>{ if(seen.has(x.m)) return false; seen.add(x.m); return true; });
}
function checkLayout(s, units, L){ return checkUnit(s, units, L, null); }

function hotGroups(s,units,L){
  const o=s.norms.hoodOver, rs=units.filter(u=>u.c.hot&&L[u.key]).map(u=>{ const b=bbox(u.c,L[u.key]); return {x:b.x-o,y:b.y-o,w:b.w+2*o,h:b.h+2*o}; });
  const par=rs.map((_,i)=>i), f=i=>par[i]===i?i:(par[i]=f(par[i]));
  for(let i=0;i<rs.length;i++) for(let j=i+1;j<rs.length;j++) if(gap(rs[i],rs[j])<0.05) par[f(i)]=f(j);
  return new Set(rs.map((_,i)=>f(i))).size;
}
function hoods(s, units){
  const L=s.layout, o=s.norms.hoodOver, W=s.room.w, D=s.room.d;
  const ex=s.points.filter(p=>p.type==='hood').map(p=>ptRect(s,p));
  const covered=u=>{ if(!L[u.key]) return false; const b=bbox(u.c,L[u.key]), cx=b.x+b.w/2, cy=b.y+b.h/2; return ex.some(r=>cx>=r.x&&cx<=r.x+r.w&&cy>=r.y&&cy<=r.y+r.h); };
  const hot=units.filter(u=>u.c.hot);
  const skew=u=>posAng(L[u.key])!==0&&L[u.key].sw;
  const rects=hot.filter(u=>L[u.key]&&!covered(u)&&!skew(u)).map(u=>{ const b=bbox(u.c,L[u.key]);
    let x1=b.x-o, y1=b.y-o, x2=b.x+b.w+o, y2=b.y+b.h+o;
    for(const w of roomWalls(s.room)){ const sp=spanOnWall(s.room,w,b); if(w.axis && backDist(s.room,w,b)<=0.4 && sp[1]>0 && sp[0]<w.len){ if(w.axis==='h'){ if(w.ny>0) y1=w.y1; else y2=w.y1; } else { if(w.nx>0) x1=w.x1; else x2=w.x1; } } }   // зонт у стены — до стены
    x1=Math.max(0,x1); y1=Math.max(0,y1); x2=Math.min(W,x2); y2=Math.min(D,y2); return {x:x1,y:y1,w:x2-x1,h:y2-y1}; });
  let m=[...rects], ch=true;
  while(ch){ ch=false;
    out: for(let i=0;i<m.length;i++) for(let j=i+1;j<m.length;j++){ if(gap(m[i],m[j])<0.05){ const a=m[i],b=m[j],x=Math.min(a.x,b.x),y=Math.min(a.y,b.y);
      m[i]={x,y,w:Math.max(a.x+a.w,b.x+b.w)-x,h:Math.max(a.y+a.h,b.y+b.h)-y}; m.splice(j,1); ch=true; break out; } } }
  const notPl=hot.filter(u=>!L[u.key]);
  const extra=notPl.reduce((a,u)=>a+(u.c.w+2*o)*(u.c.d+o),0), extraLen=notPl.reduce((a,u)=>a+u.c.w+2*o,0);
  const list=m.map(r=>({...r, area:r.w*r.h, len:Math.max(r.w,r.h)}));
  const spans=hot.filter(u=>L[u.key]&&!covered(u)&&skew(u)).map(u=>{ const pos=L[u.key], w=wallById(s.room,pos.sw), [t0,t1]=unitWallSpan(s.room,pos.sw,u.c,pos);
    return {sw:pos.sw,t0:Math.max(0,t0-o),t1:Math.min(w.len,t1+o),dep:u.c.d+o}; }).sort((a,b)=>a.t0-b.t0);
  const merged=[];
  for(const r of spans){ const prev=merged.findLast(p=>p.sw===r.sw); if(prev&&r.t0-prev.t1<0.05){ prev.t1=Math.max(prev.t1,r.t1); prev.dep=Math.max(prev.dep,r.dep); } else merged.push({...r}); }
  for(const r of merged){ const w=wallById(s.room,r.sw), point=(t,d)=>({x:w.x1+w.dir.x*t+w.nx*d,y:w.y1+w.dir.y*t+w.ny*d}), poly=[point(r.t0,0),point(r.t1,0),point(r.t1,r.dep),point(r.t0,r.dep)], xs=poly.map(p=>p.x), ys=poly.map(p=>p.y), x=Math.min(...xs), y=Math.min(...ys), len=r.t1-r.t0;
    list.push({poly,x,y,w:Math.max(...xs)-x,h:Math.max(...ys)-y,area:len*r.dep,len,sw:r.sw}); }
  const area=list.reduce((a,r)=>a+r.area,0)+extra, len=list.reduce((a,r)=>a+r.len,0)+extraLen;
  const exArea=ex.filter(r=>hot.some(u=>covered(u))).reduce((a,r)=>a+r.w*r.h,0);
  return {list, area, len, exArea, coveredN:hot.filter(covered).length, exhaust:3600*s.norms.hoodV*(area+exArea)};
}

function water(items){ let cw=0,hw=0,dr=0; const pts=[];
  for(const it of items){ const c=it.c; if(c.cw||c.hw||c.dr){ cw+=(c.cw||0)*it.qty; hw+=(c.hw||0)*it.qty; dr+=(c.dr||0)*it.qty; pts.push(it); } }
  return {cw,hw,dr,pts}; }
function countRole(items, role){ return items.reduce((a,it)=>a+(it.c.role===role?it.qty:0),0); }
function sanitary(s, items){
  const r=role=>countRole(items,role), st=s.norms.strict;
  const list=[
    {ok:r('handsink')>=1, m:'Раковина для мытья рук у входа на кухню'},
    {ok:r('bathRaw')>=1, m:'Отдельная мойка для овощей и сырых продуктов — не там, где моют посуду'},
    {ok:hasPt(s,'vent')||hasPt(s,'hood')||r('combi')+r('burners')+r('kettle')===0 ? true : netsDesign(s) ? null : false, m:'Вытяжка над тепловым оборудованием'},
    {ok:(r('dish')+r('bathTable')+r('bathKitchen'))>=1, m:'Место для мытья посуды'}];
  if(s.feats.fish) list.push({ok:r('tableFish')>=1 && r('bathFish')>=1, m:'Отдельные стол и мойка для рыбы, чтобы запах не переходил на остальное'});
  if(s.feats.meat) list.push({ok:r('tableMeat')>=1 && r('bathMeat')>=1, m:'Отдельные стол и мойка для мяса и птицы'});
  if(st) list.push(
    {ok:r('tableRaw')>=1 && (r('tableReady')+r('coldtable'))>=1, m:'Раздельные столы для сырой и готовой продукции'},
    {ok:r('bathKitchen')>=1 && (r('dish')+r('bathTable'))>=1, m:'Раздельная мойка кухонной и столовой посуды'},
    {ok:r('fridge')+r('coldtable')>=2, m:'Раздельное холодильное хранение сырья и готовой продукции'},
    {ok:r('thermo')>=1, m:'Термометр для контроля температуры блюд на раздаче'});
  list.push({ok:null, m:'Сырое, готовое и грязная посуда по возможности не пересекаются — посмотрите на плане'});
  return list;
}

/* ---- формат ---- */
function fmt1(n){ return (Math.round(n*10)/10).toLocaleString('ru-RU'); }
function fmt2(n){ return (Math.round(n*100)/100).toLocaleString('ru-RU'); }
function fmt0(n){ return Math.round(n).toLocaleString('ru-RU'); }
function fmtM(n){ return fmt2(n)+' м'; }
function rub(n){ return Math.round(n).toLocaleString('ru-RU')+' ₽'; }
function plural(n,a,b,c){ n=Math.abs(n)%100; const n1=n%10; if(n>10&&n<20) return c; if(n1>1&&n1<5) return b; if(n1===1) return a; return c; }
function esc(t){ return String(t).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
function uid(p){ return p+Date.now().toString(36)+Math.random().toString(36).slice(2,5); }

<script>
/* ===================== ИНТЕРФЕЙС ===================== */
/* ======================================================================
   STORE — хранилище проектов. Один интерфейс: list / load / save / remove.
   Сейчас — localStorage этого браузера; чтобы перейти на облако, достаточно заменить этот блок.
   Индекс 'trapeznaya:index' хранит сводку для карточек, проекты — 'trapeznaya:p:<id>', последний открытый — 'trapeznaya:last'.
   ====================================================================== */
const KEY='trapeznaya-v1';   // прежний единственный проект: читается один раз при переносе, не удаляется
const STORE=(()=>{
  const IX='trapeznaya:index', PK='trapeznaya:p:', LAST='trapeznaya:last';
  const get=k=>{ try{ return localStorage.getItem(k); }catch(e){ return null; } };
  const isQuota=e=>!!e && (e.name==='QuotaExceededError' || e.name==='NS_ERROR_DOM_QUOTA_REACHED' || e.code===22 || e.code===1014);
  const readIx=()=>{ try{ const a=JSON.parse(get(IX)||'null'); return Array.isArray(a)?a:null; }catch(e){ return null; } };
  const st={ error:null, PK, IX,
    list(){ return (readIx()||[]).slice().sort((a,b)=>String(b.updatedAt||'').localeCompare(String(a.updatedAt||''))); },
    load(id){ try{ const t=get(PK+id); return t?JSON.parse(t):null; }catch(e){ return null; } },
    raw(id){ return get(PK+id); },
    save(id, data, summary){
      try{ const txt=typeof data==='string'?data:JSON.stringify(data); localStorage.setItem(PK+id, txt);
        const ix=readIx()||[], i=ix.findIndex(x=>x.id===id), row=Object.assign({}, i>=0?ix[i]:{}, summary||{}, {id});
        if(i>=0) ix[i]=row; else ix.push(row); localStorage.setItem(IX, JSON.stringify(ix)); st.error=null; return true; }
      catch(e){ st.error=isQuota(e)?'quota':'other'; return false; } },
    remove(id){ try{ localStorage.removeItem(PK+id); localStorage.setItem(IX, JSON.stringify((readIx()||[]).filter(x=>x.id!==id))); if(get(LAST)===id) localStorage.removeItem(LAST); return true; }catch(e){ return false; } },
    mark(id, patch){ try{ const ix=readIx()||[], r=ix.find(x=>x.id===id); if(!r) return false; Object.assign(r, patch); localStorage.setItem(IX, JSON.stringify(ix)); return true; }catch(e){ return false; } },
    meta(id){ return (readIx()||[]).find(x=>x.id===id)||null; },
    last(){ return get(LAST); },
    setLast(id){ try{ if(id) localStorage.setItem(LAST,id); else localStorage.removeItem(LAST); }catch(e){} },
    hasIndex(){ return readIx()!==null; },
    // перенос: был один проект под старым ключом, индекса ещё нет — он становится первым проектом списка
    migrateOld(){ if(st.hasIndex()) return null; const t=get(KEY); if(!t) return null;
      try{ const m=migrate(JSON.parse(t)); if(!m) return null; ensureIds(m); m.updatedAt=m.updatedAt||new Date().toISOString();
        const ok=st.save(m.pid, m, {name:m.name, org:(m.report&&m.report.meta&&m.report.meta.parish)||'', people:m.people, kw:null, total:null, createdAt:m.createdAt, updatedAt:m.updatedAt, variantOf:null});
        if(ok) st.setLast(m.pid); return ok?m.pid:null; }catch(e){ return null; } }
  };
  return st;
})();

const HIST_MAX=10; let undoStack=[], redoStack=[], lastSnap=null, lastPush=0;
function snap(){ return JSON.stringify(S,(k,v)=>k==='cur'||k==='updatedAt'?undefined:v); }
function touch(){ S.example=false; commit(); }
function commit(){
  const now=snap();
  if(lastSnap!==null && now!==lastSnap){
    if(Date.now()-lastPush>700){ undoStack.push(lastSnap); if(undoStack.length>HIST_MAX) undoStack.shift(); redoStack=[]; lastPush=Date.now(); }
    else lastPush=Date.now();
  }
  lastSnap=now; save(); updUndo(); }
function restoreSnap(t){ const cur=S.cur, o=JSON.parse(t); S=prepare(o); if(S.rooms.some(r=>r.id===cur)) S.cur=cur; lastSnap=snap(); lastPush=0;
  sel=null; selRoom=null; addMode=null; editUid=null; draft=null; confirmReset=false; confirmRoomDel=false; rpOpen=rpOpen&&step===1&&S.rooms.some(r=>r.id===cur); confirmArrange=false; heatRecOpen=false; heatRecErr=false; save(); render(); updUndo(); }
function doUndo(){ if(!undoStack.length) return; redoStack.push(snap()); if(redoStack.length>HIST_MAX) redoStack.shift(); restoreSnap(undoStack.pop()); toast('Действие отменено'); }
function doRedo(){ if(!redoStack.length) return; undoStack.push(snap()); if(undoStack.length>HIST_MAX) undoStack.shift(); restoreSnap(redoStack.pop()); toast('Действие повторено'); }
function updUndo(){ const u=document.getElementById('undo'), r=document.getElementById('redo'); if(!u) return;
  u.disabled=!undoStack.length; r.disabled=!redoStack.length;
  u.title=`Отменить (Ctrl+Z) · доступно шагов: ${undoStack.length}`; r.title=`Повторить (Ctrl+Shift+Z) · доступно шагов: ${redoStack.length}`; }
document.getElementById('undo').addEventListener('click',doUndo);

document.addEventListener('keydown',e=>{ const t=e.target; if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT')) return;
  if(!(e.ctrlKey||e.metaKey)) return; const k=e.key.toLowerCase();

  S.layoutRoom=S.layoutRoom||{};
  for(const u of P.units){ const pos=S.layout[u.key]; if(!pos) continue; const rid=P.roomOf[u.key], lr=S.layoutRoom[u.key], room=rById(rid);
    if(lr && lr!==rid){ delete S.layout[u.key]; delete S.layoutRoom[u.key]; continue; }
    const b=bbox(u.c,pos);

// повторная отрисовка без изменений проекта (переход по шагам, выбор на плане) берёт прежний результат: ключ — снимок проекта и расстановка
let issCache={key:null, val:null};
function stepIss(){ if(P.iss) return P.iss;
  const key=lastSnap!=null?lastSnap+'|'+S.layoutSig+'|'+JSON.stringify(S.layout):null;
  if(key && issCache.key===key){ P.iss=issCache.val; return P.iss; }
  const R=STEP_NAMES.map(()=>({bad:0, warn:0, list:[], seen:new Set()})), lay={};
  const add=(i,t,m,room)=>{ if(t!=='bad'&&t!=='warn') return; const r=R[i]; if(r.seen.has(m)) return; r.seen.add(m); r[t]++; r.list.push(room?{t,m,room}:{t,m}); };
  for(const n of P.notes) add(n.step!=null?n.step:4, n.t, n.m);
  if(S.res && S.res.max!=null && S.res.kw!=null && S.res.max<S.res.kw) add(0,'bad',`«Можно увеличить до» меньше, чем выделено сейчас (${fmt1(S.res.kw)} кВт).`);

        if(!i.key && (i.sw || /электрощит/.test(i.m))) add(2, i.t, m); } } }   // точки: кран у щита, помещение без выпуска

function snapRoom(r){

    for(const t of [o.y+o.d+WALL_GAP, o.y-r.d-WALL_GAP, o.y, o.y+o.d-r.d]){ const d=Math.abs(r.y-t); if(d<dy){ dy=d; by=t; } }
    if(hasPoly(o)) for(const w of roomWalls(o)){ if(w.axis==='v'){ const X=o.x+w.x1; for(const t of [X+WALL_GAP,X-r.w-WALL_GAP,X,X-r.w]){ const d=Math.abs(r.x-t); if(d<dx){ dx=d; bx=t; } } }
      else if(w.axis==='h'){ const Y=o.y+w.y1; for(const t of [Y+WALL_GAP,Y-r.d-WALL_GAP,Y,Y-r.d]){ const d=Math.abs(r.y-t); if(d<dy){ dy=d; by=t; } } } } }
  return {bx,by}; };
  let skew=null, ds=0.3;
  for(const wa of roomWalls(r)){ if(wa.axis!==null) continue;
    for(const o of S.rooms){ if(o===r) continue;
      for(const wb of roomWalls(o)){ if(wb.axis!==null || Math.abs(wb.nx+wa.nx)>=1e-6 || Math.abs(wb.ny+wa.ny)>=1e-6) continue;
        const x=(o.x+wb.x1)-(r.x+wa.x1), y=(o.y+wb.y1)-(r.y+wa.y1), outside=-(x*wa.nx+y*wa.ny), t1=x*wa.dir.x+y*wa.dir.y, t2=((o.x+wb.x2)-(r.x+wa.x1))*wa.dir.x+((o.y+wb.y2)-(r.y+wa.y1))*wa.dir.y;
        if(Math.min(wa.len,Math.max(t1,t2))-Math.max(0,Math.min(t1,t2))<=0) continue;
        const err=WALL_GAP-outside; if(Math.abs(err)<ds){ ds=Math.abs(err); skew={x:wa.nx*err,y:wa.ny*err,dir:wa.dir}; } } } }
  if(skew){ r.x+=skew.x; r.y+=skew.y;
    const {bx,by}=straightTargets(), t=skew.dir; let s=null;
    if(bx!=null && Math.abs(t.x)>0.2) s=(bx-r.x)/t.x;
    if(by!=null && Math.abs(t.y)>0.2){ const sy=(by-r.y)/t.y; if(s===null || Math.abs(sy)<Math.abs(s)) s=sy; }
    if(s!==null && Math.abs(s)<0.3){ r.x+=t.x*s; r.y+=t.y*s; }
    r.x=+r.x.toFixed(3); r.y=+r.y.toFixed(3); return; }
  const {bx,by}=straightTargets();
  if(bx!=null) r.x=+bx.toFixed(3); if(by!=null) r.y=+by.toFixed(3);
}

    <p style="margin:0;max-width:72ch;font-size:14.5px">Автоматическая расстановка начинается с тепловой линии: перебираются её положения у стен, затем вокруг неё выстраивается технологический поток — от двери загрузки вдоль стен — раковина для рук, хранение, мытьё, чистка и разделка, нарезка, термообработка одной линией под один зонт, сервировка — и заканчивается выдачей у двери в трапезную. Мойка посуды ставится после выдачи. Если дверь одна, поток идёт по кругу и возвращается к ней. Оборудование выстраивается в линию без разрывов: углы и промежутки заполняются столами-вставками — им не нужна своя рабочая зона, на них и под ними можно хранить. Под окнами ставятся только столы и низкое оборудование; высокое — не ближе 120 мм к краю проёма, до 80 мм — только если иначе всё не помещается. Аппараты со сливом — ванны, раковины, посудомоечная машина, пароконвектомат, котёл, сковорода — тянутся к выпуску канализации: слив считается вдоль стен, через дверной проём не проходит, выступ огибает; до трапа в полу — по прямой. Длиннее предела — замечание. Перебираются оба направления обхода, и выбирается вариант с меньшим числом нарушений и отступлений от потока.</p>

REPORT.register({ id:'room-need', title:'Требуемые подключения', group:'Оборудование', order:800, audience:['full','electric','plumbing'], perRoom:true,
  available: ()=>P.items.length>0,
  build(ctx){ const r=ctx.room, pos=ctx.pos, us=roomUnitsOf(r.id);
    const H=(()=>{ const c=S.cur; S.cur=r.id; try{ return hoods(curGeom(),curUnits()); } finally{ S.cur=c; } })();
    const under=u=>{ const p=S.layout[u.key]; if(!p) return false; const b=bbox(u.c,p), cx=b.x+b.w/2, cy=b.y+b.h/2; return H.list.some(h=>h.poly?pointInPoly(h.poly,cx,cy):cx>=h.x&&cx<=h.x+h.w&&cy>=h.y&&cy<=h.y+h.h); };
    const m=new Map(); for(const u of us){ const p=pos.unit(u); if(!p) continue; const x=m.get(p.no)||{p,n:0,hood:false}; x.n++; x.hood=x.hood||under(u)||(u.c.hot&&!S.layout[u.key]); m.set(p.no,x); }
    // настольное с питанием или водой — тоже в таблицу
    pos.list.filter(p=>p.c.mount==='table'&&p.rooms.includes(r.id)&&((p.c.kw||0)>0||p.c.cw||p.c.dr)).forEach(p=>m.set(p.no,{p,n:p.qty,hood:false}));
    const yes=v=>v?'✓':'';
    const rows=[...m.values()].sort((a,b)=>a.p.no-b.p.no).filter(x=>(x.p.c.kw||0)>0||x.p.c.cw||x.p.c.hw||x.p.c.dr||x.p.c.gas||x.p.c.hot).map(x=>{ const c=x.p.c;
      const an=us.filter(u=>pos.unit(u)===x.p && S.layout[u.key]).map(u=>needAnchor(u,r)), walls=[...new Set(an.map(a=>a.wall))];
      const drv=hasDrain(c)?drainVals(us.filter(u=>pos.unit(u)===x.p)).map(v=>v.t).join('; '):'';
      return [String(x.p.no), shortName(c)+(x.n>1?` × ${x.n}`:''), (c.kw||0)>0?fmt1(c.kw*x.n):'—', volts(c), yes(c.cw), yes(c.hw), yes(c.dr), drv, c.gas?(c.gkw?fmt1(c.gkw*x.n):'✓'):'', x.hood?'да':'', walls.join(', ')||'на столе', an.map(a=>a.along).join('; ')||'—', an.length?'по паспорту аппарата':'—']; });
    // сети проектируются: раздел — задание, куда вывести сети; перед таблицей — итог по помещению
    const nd=netsDesign(S), xs=[...m.values()], cnt=f=>xs.reduce((a,x)=>a+(f(x.p.c)?x.n:0),0), el=xs.filter(x=>(x.p.c.kw||0)>0);
    const sumLine=`Холодная вода — ${cnt(c=>c.cw)} ${plural(cnt(c=>c.cw),'вывод','вывода','выводов')}, горячая — ${cnt(c=>c.hw)}, канализация — ${cnt(c=>c.dr)} ${plural(cnt(c=>c.dr),'выпуск','выпуска','выпусков')}, электрика: 220 В — ${el.filter(x=>x.p.c.ph!==3).reduce((a,x)=>a+x.n,0)}, 380 В — ${el.filter(x=>x.p.c.ph===3).reduce((a,x)=>a+x.n,0)}, суммарно ${fmt1(el.reduce((a,x)=>a+x.p.c.kw*x.n,0))} кВт; газ — ${cnt(c=>c.gas)}; вытяжка — ${fmt0(H.exhaust)} м³/ч.`;
    return [{t:'h2', text:`«${r.name}»: ${nd?'задание: куда вывести сети':'требуемые подключения'}`},
      nd&&rows.length?{t:'p', text:sumLine}:null,
      rows.length?{t:'table', cols:[{title:'Поз.',w:.5,align:'r'},{title:'Аппарат',w:2.4},{title:'кВт',w:.6,align:'r'},{title:'В',w:.55,align:'r'},{title:'ХВ',w:.45,align:'c'},{title:'ГВ',w:.45,align:'c'},{title:'К',w:.45,align:'c'},{title:'Слив до выпуска, м',w:1,align:'r'},{title:'Газ, кВт',w:.7,align:'r'},{title:'Под зонт',w:.65,align:'c'},{title:'Стена',w:.9},{title:'От угла, мм',w:.95,align:'r'},{title:'Высота от пола, мм',w:.95}], rows,
        note:`Места подключений на плане ориентировочные — у стены за аппаратом. «От угла» — до центра метки подключения вдоль стены, от угла, отмеченного «0» на плане. Высота выводов — по паспорту выбранной модели. Слив до выпуска — вдоль стен до ближайшего выпуска этого помещения (на плане — пунктиром), через дверной проём не проходит; до трапа в полу — по прямой; предел ${fmtM(swMax(S))}.`}:{t:'p', text:'Подключения не требуются.', muted:true},
      rows.length?ctx.plan.room(r,'need'):null].filter(Boolean); } });
// в режиме «сети проектируются» раздел называется «Задание: куда вывести сети» — в окне выгрузки, оглавлении и колонтитулах

/* ---- сборка документа: титул + выбранные разделы; подряд идущие поэтажные разделы — по помещениям ---- */
function buildReportDoc(options){
  options=Object.assign({mono:reportState().mono}, options||{});
  const r=reportState(), preset=options.preset||r.preset;
  const on = id => { const s=REPORT.get(id); if(s.always) return true; if(options.sections) return !!options.sections[id]; if(preset!=='custom') return s.audience.includes(preset); return !!r.sections[id]; };
  const ctx=reportCtx({mono:options.mono});
  const secs=REPORT.sections.filter(s=>{ try{ return on(s.id) && s.available(ctx); }catch(e){ return false; } });
  const parts=[]; let i=0;
  while(i<secs.length){
    if(!secs[i].perRoom){ parts.push({title:secs[i].title, id:secs[i].id, blocks:secs[i].build(ctx)}); i++; continue; }
    const run=[]; while(i<secs.length&&secs[i].perRoom) run.push(secs[i++]);
    for(const room of S.rooms) for(const s of run){ const c=Object.assign({}, ctx, {room}); parts.push({title:(S.rooms.length>1?room.name+' · ':'')+s.title, id:s.id+':'+room.id, blocks:s.build(c)}); }
  }
  parts.forEach(p=>p.blocks=p.blocks.filter(Boolean));
  return {title:S.name||'Трапезная', date:new Date(), mono:!!options.mono, parts};
}
function reportFileName(){ const d=new Date(), pad=n=>String(n).padStart(2,'0');
  const name=(S.name||'Трапезная').replace(/[\\/:*?"<>|\u0000-\u001f]+/g,' ').replace(/\s+/g,' ').trim().slice(0,120)||'Трапезная';
  return `Задание — ${name} — ${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}.pdf`; }

/* ================= Рендер 1: предпросмотр в HTML (листы A4) ================= */
const PAGE_MM={portrait:{w:210,h:297}, landscape:{w:297,h:210}}, PAGE_M={l:16, r:16, t:18, b:16};
const LEVEL_MARK={bad:'!', warn:'?', info:'i', ok:'✓'}, CHECK_MARK={ok:'✓', bad:'✗', man:'?'};
function htmlFonts(svg){ return svg.replace(/font-family="IBMPlexSans"/g,'font-family="IBM Plex Sans, Arial, sans-serif"').replace(/font-family="IBMPlexMono"/g,'font-family="IBM Plex Mono, monospace"'); }
function blockHtml(b){
  const e=esc;
  switch(b.t){
    case 'h1': case 'h2': case 'h3': return `<${b.t} class="rp-${b.t}">${e(b.text)}</${b.t}>`;
    case 'p': return `<p class="rp-p${b.muted?' muted':''}">${e(b.text)}</p>`;
    case 'kv': { const c=b.cols===2?2:1; return `<div class="rp-kv c${c}">${b.rows.map(r=>`<span class="k">${e(r[0])}</span><span class="v">${e(r[1])}</span>`).join('')}</div>`; }
    case 'table': return tableHtml(b, b.rows, true);
    case 'notes': return `<ul class="rp-notes">${b.items.map(i=>`<li class="${i.level}"><span class="mk">${LEVEL_MARK[i.level]||'i'}</span><span>${e(i.text)}</span></li>`).join('')}</ul>`;
    case 'checklist': return `<ul class="rp-notes rp-check">${b.items.map(i=>`<li class="${i.state==='ok'?'ok':i.state==='bad'?'bad':'info'}"><span class="mk">${CHECK_MARK[i.state]}</span><span>${e(i.text)}</span></li>`).join('')}</ul>`;
    case 'sign': return `<div class="rp-sign">${b.rows.map(r=>`<div><span>${e(r)}</span><i></i><span class="d">подпись</span><i class="sh"></i><span class="d">дата</span></div>`).join('')}</div>`;
  }
  return '';
}
function tableHtml(b, rows, withFoot){
  const tw=b.cols.reduce((a,c)=>a+(c.w||1),0), e=esc, al=c=>c.align==='r'?'r':c.align==='c'?'c':'';
  let body='', last;
  for(const r of rows){ if(b.groupBy!=null && r[b.groupBy]!==last){ last=r[b.groupBy]; body+=`<tr class="grp"><td colspan="${b.cols.length}">${e(last)}</td></tr>`; }
    body+=`<tr>${r.map((v,i)=>`<td class="${al(b.cols[i]||{})}">${e(v==null?'':v)}</td>`).join('')}</tr>`; }
  return `<table class="rp-table"><colgroup>${b.cols.map(c=>`<col style="width:${((c.w||1)/tw*100).toFixed(2)}%">`).join('')}</colgroup><thead><tr>${b.cols.map(c=>`<th class="${al(c)}">${e(c.title)}</th>`).join('')}</tr></thead><tbody>${body}</tbody>${withFoot&&b.foot?`<tfoot>${b.foot.map(r=>`<tr>${r.map((v,i)=>`<td class="${al(b.cols[i]||{})}">${e(v)}</td>`).join('')}</tr>`).join('')}</tfoot>`:''}</table>${withFoot&&b.note?`<p class="rp-p muted rp-note">${e(b.note)}</p>`:''}`;
}
function planPageHtml(b){
  return `<div class="rp-plan"><div class="rp-cap"><b>${esc(b.caption)}</b>${b.scale?`<span>М ${esc(b.scale)}</span>`:''}</div>
    <div class="rp-svg" style="width:${b.wMm.toFixed(1)}mm;height:${b.hMm.toFixed(1)}mm">${htmlFonts(b.svg).replace(/<svg /,'<svg style="width:100%;height:100%" ')}</div>
    ${b.legend&&b.legend.length?`<div class="rp-legend">${b.legend.map(l=>`<span>${l.swatch.replace(/<svg /,'<svg style="width:7.4mm;height:3.7mm;vertical-align:middle" ')}${esc(l.text)}</span>`).join('')}</div>`:''}</div>`;
}
// раскладка по листам: измеряет настоящую высоту блоков, длинные таблицы переносит с повтором шапки
function paginateHtml(D, host){
  host.innerHTML=''; const pages=[]; let page=null, orient='portrait', title='';
  const newPage=(o)=>{ const el=document.createElement('div'); el.className='rp-page '+o; el.innerHTML=`<div class="rp-head"></div><div class="rp-body"></div><div class="rp-foot"></div>`; host.appendChild(el);
    const p={el, body:el.querySelector('.rp-body'), title, orient:o}; pages.push(p); return p; };
  const over=p=>p.body.scrollHeight>p.body.clientHeight+1;
  const add=(html)=>{ const t=document.createElement('div'); t.innerHTML=html; return [...t.childNodes]; };
  for(const part of D.parts){ title=part.title;
    for(const b of part.blocks){
      if(b.t==='pagebreak'){ page=null; orient=b.orient||'portrait'; continue; }
      if(b.t==='plan'){ const p=newPage('landscape'); p.body.innerHTML=planPageHtml(b); page=null; continue; }
      if(!page) page=newPage(orient);
      if(b.t==='table'){ placeTableHtml(b); continue; }
      const nodes=add(blockHtml(b)); nodes.forEach(n=>page.body.appendChild(n));
      if(over(page) && page.body.childNodes.length>nodes.length){ nodes.forEach(n=>n.remove()); const carry=keepWithNext(page); page=newPage(orient); carry.forEach(n=>page.body.appendChild(n)); nodes.forEach(n=>page.body.appendChild(n)); }
    } }
  function keepWithNext(p){ const out=[]; let l=p.body.lastElementChild; while(l && /^H[123]$/.test(l.tagName)){ out.unshift(l); l.remove(); l=p.body.lastElementChild; } return out; }
  function placeTableHtml(b){
    let rows=b.rows.slice();
    for(let guard=0; guard<200; guard++){
      const nodes=add(tableHtml(b, rows, true)); nodes.forEach(n=>page.body.appendChild(n));
      if(!over(page)) return;
      // сколько строк влезает
      const tb=nodes[0].querySelector('tbody'), trs=[...tb.children]; let keep=trs.length;
      const tf=nodes[0].querySelector('tfoot'); if(tf) tf.remove(); if(nodes[1]) nodes[1].remove();
      while(keep>0 && over(page)){ trs[keep-1].remove(); keep--; }
      const fitRows=trs.slice(0,keep).filter(r=>!r.classList.contains('grp')).length;
      if(fitRows<2 && page.body.childNodes.length>1){ nodes[0].remove(); const carry=keepWithNext(page); page=newPage(orient); carry.forEach(n=>page.body.appendChild(n)); continue; }
      if(fitRows===0){ return; }
      rows=rows.slice(fitRows); page=newPage(orient);
    }
  }
  pages.forEach((p,i)=>{ p.el.querySelector('.rp-head').innerHTML=`<span>${esc(D.title)}</span><span>${esc(p.title)}</span>`;
    p.el.querySelector('.rp-foot').innerHTML=`<span>${D.date.toLocaleDateString('ru-RU')}</span><span>Расчёт ориентировочный</span><span>Лист ${i+1} из ${pages.length}</span>`; });
  return pages;
}
