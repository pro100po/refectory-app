/* ================= Рендер 2: PDF (jsPDF + svg2pdf + autotable) ================= */
const PDF_LIBS=['https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js','https://cdn.jsdelivr.net/npm/svg2pdf.js@2.2.4/dist/svg2pdf.umd.min.js','https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js'];
const PDF_FONTS=[['fonts/IBMPlexSans-Regular.ttf','IBMPlexSans','normal'],['fonts/IBMPlexSans-SemiBold.ttf','IBMPlexSans','bold'],['fonts/IBMPlexMono-Regular.ttf','IBMPlexMono','normal']];
let pdfLibsP=null, pdfFontsP=null;
function loadScript(src){ return new Promise((ok,no)=>{ const s=document.createElement('script'); s.src=src; s.async=false; s.onload=ok; s.onerror=()=>no(new Error('Не загрузилась библиотека: '+src)); document.head.appendChild(s); }); }
function loadPdfLibs(){ if(!pdfLibsP) pdfLibsP=(async()=>{ for(const u of PDF_LIBS) await loadScript(u); if(!window.jspdf||!window.jspdf.jsPDF) throw new Error('jsPDF не загрузился'); })().catch(e=>{ pdfLibsP=null; throw e; }); return pdfLibsP; }
function b64(buf){ const u=new Uint8Array(buf); let s=''; for(let i=0;i<u.length;i+=0x8000) s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return btoa(s); }
function loadPdfFonts(){ if(!pdfFontsP) pdfFontsP=Promise.all(PDF_FONTS.map(async([url])=>{ const r=await fetch(url); if(!r.ok) throw new Error('Не загрузился шрифт '+url); return b64(await r.arrayBuffer()); })).catch(e=>{ pdfFontsP=null; throw e; }); return pdfFontsP; }
const hex=c=>{ const m=/^#?([0-9a-f]{6})$/i.exec(c); const n=parseInt(m?m[1]:'000000',16); return [n>>16&255, n>>8&255, n&255]; };
async function buildReportPdf(options){
  options=options||{}; const onProgress=options.onProgress||(()=>{}), est=options.estimate||0;
  await loadPdfLibs(); const fonts=await loadPdfFonts();
  const D=buildReportDoc(options), mono=D.mono;
  const C={ink:hex('#1d282d'), ink2:hex('#56646a'), rule:hex('#c9d0cb'), head:mono?[235,235,235]:hex('#eef1ee'), foot:mono?[245,245,245]:hex('#f6f8f6'),
    lv:{bad:hex(mono?'#1a1a1a':'#b2261d'), warn:hex(mono?'#1a1a1a':'#a86a0c'), info:hex(mono?'#1a1a1a':'#2e5964'), ok:hex(mono?'#1a1a1a':'#2d7448')}};
  const {jsPDF}=window.jspdf, doc=new jsPDF({unit:'mm', format:'a4', orientation:'portrait', compress:true});
  PDF_FONTS.forEach(([url,fam,sty],i)=>{ const f=url.split('/').pop(); doc.addFileToVFS(f,fonts[i]); doc.addFont(f,fam,sty); });
  doc.setFont('IBMPlexSans','normal');
  let orient='portrait', title=D.parts.length?D.parts[0].title:'', fresh=true; const secOf={1:title}, orientOf={1:'portrait'};
  const origAdd=doc.addPage.bind(doc);
  doc.addPage=function(fmt,o){ const r=origAdd(fmt||'a4', o||orient); const n=doc.internal.getNumberOfPages(); secOf[n]=title; orientOf[n]=o||orient; fresh=true; return r; };
  const dims=()=>{ const o=orientOf[doc.internal.getCurrentPageInfo().pageNumber]||'portrait'; const P2=PAGE_MM[o]; return {W:P2.w, H:P2.h, L:PAGE_M.l, R:P2.w-PAGE_M.r, T:PAGE_M.t+1, B:P2.h-PAGE_M.b-1}; };
  let y=dims().T;
  // новый лист; пустой текущий лист переиспользуется (или заменяется, если нужна другая ориентация)
  const page=(o)=>{ o=o||orient; const n=doc.internal.getNumberOfPages();
    if(fresh && n>1 && orientOf[n]!==o){ doc.deletePage(n); delete secOf[n]; delete orientOf[n]; }
    else if(fresh && orientOf[n]===o){ secOf[n]=title; y=dims().T; return; }
    doc.addPage('a4', o); y=dims().T; };
  const ensure=(h)=>{ if(y+h>dims().B && !fresh){ page(); } };
  const pt=mm=>mm/0.3528;
  const lh=sz=>sz*0.3528*1.35;
  const text=(str,{size=9.5,bold=false,color=C.ink,x,w,gapAfter=1.6,keep=0}={})=>{ const d=dims(); x=x==null?d.L:x; w=w||d.R-x;
    doc.setFont('IBMPlexSans', bold?'bold':'normal'); doc.setFontSize(size); doc.setTextColor(...color);
    const lines=doc.splitTextToSize(String(str), w), L1=lh(size);
    ensure(Math.max(Math.min(lines.length,3)*L1,keep));
    // длинный абзац переносится на следующий лист по строкам
    let i=0; while(i<lines.length){ const room=Math.max(1,Math.floor((dims().B-y)/L1)), part=lines.slice(i,i+room);
      doc.setFont('IBMPlexSans', bold?'bold':'normal'); doc.setFontSize(size); doc.setTextColor(...color);
      doc.text(part, x, y, {baseline:'top', lineHeightFactor:1.35}); y+=part.length*L1; i+=part.length; fresh=false; if(i<lines.length) page(); }
    y+=gapAfter; };
  const tableOpts=(extra)=>Object.assign({startY:y, margin:{left:PAGE_M.l, right:PAGE_M.r, top:PAGE_M.t+1, bottom:PAGE_M.b+1},
    styles:{font:'IBMPlexSans', fontSize:8, cellPadding:{top:0.9,bottom:0.9,left:1.2,right:1.2}, textColor:C.ink, lineColor:C.rule, lineWidth:0.2, overflow:'linebreak', valign:'top'},
    headStyles:{fontStyle:'bold', fillColor:C.head, textColor:C.ink}, footStyles:{fontStyle:'bold', fillColor:C.foot, textColor:C.ink},
    showHead:'everyPage', showFoot:'lastPage', theme:'grid', rowPageBreak:'avoid'}, extra);
  const drawMarks=(items,markOf,levelOf)=>{ const d=dims(); for(const it of items){
    doc.setFont('IBMPlexSans','normal'); doc.setFontSize(9); const lines=doc.splitTextToSize(it.text, d.R-d.L-7), h=Math.max(4.6, lines.length*lh(9));
    ensure(h+1.2); const col=C.lv[levelOf(it)]||C.lv.info, cx=d.L+2.1, cy=y+2.1;
    if(mono){ doc.setDrawColor(...C.ink); doc.setLineWidth(0.3); doc.setFillColor(255,255,255); doc.circle(cx,cy,2.05,'FD'); doc.setTextColor(...C.ink); }
    else { doc.setFillColor(...col); doc.circle(cx,cy,2.05,'F'); doc.setTextColor(255,255,255); }
    doc.setFont('IBMPlexSans','bold'); doc.setFontSize(7.5); doc.text(markOf(it), cx, cy+0.05, {align:'center', baseline:'middle'});
    doc.setFont('IBMPlexSans','normal'); doc.setFontSize(9); doc.setTextColor(...C.ink); doc.text(lines, d.L+6, y+0.25, {baseline:'top', lineHeightFactor:1.35}); y+=h+1.4; fresh=false; } y+=1; };
  const svgEl=(str)=>{ const box=document.createElement('div'); box.style.cssText='position:fixed;left:-10000px;top:0;width:10px;height:10px;overflow:hidden'; box.innerHTML=str; document.body.appendChild(box); return {el:box.firstElementChild, done:()=>box.remove()}; };
  let blocksDone=0; const blocksTotal=D.parts.reduce((a,p)=>a+p.blocks.length,0);
  for(let pi=0; pi<D.parts.length; pi++){ const part=D.parts[pi]; title=part.title;
    if(pi>0 && !fresh){ ensure(30); } if(fresh) secOf[doc.internal.getNumberOfPages()]=title;
    for(const b of part.blocks){
      const d=dims();
      if(b.t==='pagebreak'){ orient=b.orient||'portrait'; page(orient); }
      else if(b.t==='h1'){ if(!fresh) y+=3; text(b.text,{size:15,bold:true,gapAfter:2.8,keep:28}); }
      else if(b.t==='h2'){ if(!fresh) y+=2.5; text(b.text,{size:12.5,bold:true,gapAfter:2.2,keep:26}); }
      else if(b.t==='h3'){ if(!fresh) y+=2.2; text(b.text,{size:10.5,bold:true,gapAfter:1.6,keep:22}); }
      else if(b.t==='p'){ text(b.text,{size:b.muted?8.5:9.5, color:b.muted?C.ink2:C.ink, gapAfter:2}); }
      else if(b.t==='kv'){ const two=b.cols===2, body=[]; if(two){ for(let i=0;i<b.rows.length;i+=2){ const a=b.rows[i], c=b.rows[i+1]||['','']; body.push([a[0],a[1],c[0],c[1]]); } } else body.push(...b.rows.map(r=>[r[0],r[1]]));
        const w=d.R-d.L, cs=two?{0:{cellWidth:w*0.27,textColor:C.ink2},1:{cellWidth:w*0.23},2:{cellWidth:w*0.27,textColor:C.ink2},3:{cellWidth:w*0.23}}:{0:{cellWidth:w*0.42,textColor:C.ink2},1:{cellWidth:w*0.58}};
        ensure(8); doc.autoTable(tableOpts({startY:y, body, theme:'plain', styles:{font:'IBMPlexSans', fontSize:9, cellPadding:{top:0.5,bottom:0.5,left:0,right:3}, textColor:C.ink, overflow:'linebreak'}, columnStyles:cs}));
        y=doc.lastAutoTable.finalY+2.5; fresh=false; }
      else if(b.t==='table'){ const tw=b.cols.reduce((a,c)=>a+(c.w||1),0), W2=d.R-d.L, cs={};
        b.cols.forEach((c,i)=>cs[i]={cellWidth:W2*(c.w||1)/tw, halign:c.align==='r'?'right':c.align==='c'?'center':'left'});
        let body=b.rows.map(r=>r.map(v=>v==null?'':String(v)));
        if(b.groupBy!=null){ const out=[]; let last; for(const r of body){ if(r[b.groupBy]!==last){ last=r[b.groupBy]; out.push([{content:last, colSpan:b.cols.length, styles:{fontStyle:'bold', fillColor:C.foot}}]); } out.push(r); } body=out; }
        ensure(14); doc.autoTable(tableOpts({startY:y, head:[b.cols.map(c=>c.title)], body, foot:b.foot||undefined, columnStyles:cs,
          headStyles:{fontStyle:'bold', fillColor:C.head, textColor:C.ink, halign:'left'}, didParseCell:(h)=>{ if((h.section==='head'||h.section==='foot')&&cs[h.column.index]) h.cell.styles.halign=cs[h.column.index].halign; } }));
        y=doc.lastAutoTable.finalY+2; fresh=false; if(b.note) text(b.note,{size:8, color:C.ink2, gapAfter:2.5}); }
      else if(b.t==='notes') drawMarks(b.items, it=>LEVEL_MARK[it.level]||'i', it=>it.level);
      else if(b.t==='checklist') drawMarks(b.items, it=>CHECK_MARK[it.state], it=>it.state==='ok'?'ok':it.state==='bad'?'bad':'info');
      else if(b.t==='sign'){ for(const r of b.rows){ ensure(14); y+=8; const L=d.L; doc.setFont('IBMPlexSans','normal'); doc.setFontSize(9.5); doc.setTextColor(...C.ink); doc.text(r, L, y, {baseline:'bottom'});
          doc.setDrawColor(...C.ink); doc.setLineWidth(0.25); doc.line(L+52, y, L+112, y); doc.line(L+128, y, L+168, y);
          doc.setFontSize(7); doc.setTextColor(...C.ink2); doc.text('подпись', L+52, y+1, {baseline:'top'}); doc.text('дата', L+128, y+1, {baseline:'top'}); y+=4; fresh=false; } }
      else if(b.t==='plan'){
        page('landscape'); const dd=dims();
        doc.setFont('IBMPlexSans','bold'); doc.setFontSize(10.5); doc.setTextColor(...C.ink); doc.text(b.caption, dd.L, y, {baseline:'top', maxWidth:dd.R-dd.L-30});
        if(b.scale){ doc.setFont('IBMPlexSans','normal'); doc.text('М '+b.scale, dd.R, y, {baseline:'top', align:'right'}); }
        y+=lh(10.5)*(doc.splitTextToSize(b.caption, dd.R-dd.L-30).length)+2;
        const s=svgEl(b.svg); try{ await doc.svg(s.el, {x:dd.L+(dd.R-dd.L-b.wMm)/2, y, width:b.wMm, height:b.hMm}); } finally{ s.done(); }
        y+=b.hMm+2;
        if(b.legend&&b.legend.length){ let x=dd.L; doc.setFont('IBMPlexSans','normal'); doc.setFontSize(7.5);
          for(const l of b.legend){ const tw2=doc.getTextWidth(l.text)+10.5; if(x+tw2>dd.R){ x=dd.L; y+=5; }
            const sw=svgEl(l.swatch); try{ await doc.svg(sw.el,{x, y, width:7.4, height:3.7}); } finally{ sw.done(); }
            doc.setFont('IBMPlexSans','normal'); doc.setFontSize(7.5); doc.setTextColor(...C.ink); doc.text(l.text, x+8.6, y+1.85, {baseline:'middle'}); x+=tw2+3; } }
        fresh=false; page('portrait'); }
      blocksDone++; onProgress(doc.internal.getNumberOfPages(), Math.max(est, doc.internal.getNumberOfPages()), blocksDone/blocksTotal);
      await new Promise(r=>setTimeout(r,0));
    }
  }
  // последний пустой лист после плана — убрать
  const nP=doc.internal.getNumberOfPages(); if(fresh && nP>1){ doc.deletePage(nP); }
  const total=doc.internal.getNumberOfPages(), date=D.date.toLocaleDateString('ru-RU');
  for(let i=1;i<=total;i++){ doc.setPage(i); const o=orientOf[i]||'portrait', P2=PAGE_MM[o], L=PAGE_M.l, R=P2.w-PAGE_M.r;
    doc.setDrawColor(...C.rule); doc.setLineWidth(0.2); doc.line(L, 13.4, R, 13.4); doc.line(L, P2.h-11, R, P2.h-11);
    doc.setFont('IBMPlexSans','normal'); doc.setFontSize(7.5); doc.setTextColor(...C.ink2);
    const t1=D.title, t2=secOf[i]||''; doc.text(t1, L, 12.3, {baseline:'bottom', maxWidth:(R-L)/2}); doc.text(t2, R, 12.3, {baseline:'bottom', align:'right', maxWidth:(R-L)/2-4});
    doc.text(date, L, P2.h-9.8, {baseline:'top'}); doc.text('Расчёт ориентировочный', (L+R)/2, P2.h-9.8, {baseline:'top', align:'center'}); doc.text(`Лист ${i} из ${total}`, R, P2.h-9.8, {baseline:'top', align:'right'}); }
  doc.setProperties({title:'Задание на оборудование кухни трапезной — '+D.title, subject:'Задание на кухню трапезной', creator:'Кухня трапезной'});
  onProgress(total,total,1);
  return doc.output('blob');
}

// скачивание: возможность downloads; без неё кнопка неактивна

(function(){ const c=window.claude; if(!c||typeof c.use!=='function'){ repDlState='none'; return; }
  c.use('downloads').then(d=>{ repDl=d; repDlState=d?'ok':'none'; updRepDl(); }).catch(()=>{ repDlState='none'; updRepDl(); }); })();
function updRepDl(){ document.querySelectorAll('[data-rep-dl]').forEach(b=>{ b.disabled=repDlState!=='ok'||repBusy;
  b.title = repDlState==='ok' ? 'Скачать задание в PDF' : repDlState==='wait' ? 'Проверяю, можно ли скачивать…' : 'Скачивание недоступно в этом просмотре'; });
  document.querySelectorAll('.rep-dl-hint').forEach(h=>{ h.textContent = repDlState==='ok' ? '' : repDlState==='wait' ? 'Проверяю, можно ли скачивать…' : 'Скачивание недоступно в этом просмотре — предпросмотр работает.'; h.hidden=repDlState==='ok'; }); }
let repBusy=false, repPagesEst=0;

  try{ const D=buildReportDoc(); return paginateHtml(D, host).length; } finally{ host.remove(); } }

      <label class="field"><span>Адрес</span><input type="text" data-meta="address" value="${esc(m.address)}"></label>
      <label class="field"><span>Составитель</span><input type="text" data-meta="author" value="${esc(m.author)}"></label>
      <label class="field"><span>Контакт</span><input type="text" data-meta="contact" value="${esc(m.contact)}" placeholder="Телефон или почта"></label>
      <label class="field" style="grid-column:1/-1"><span>Примечание</span><input type="text" data-meta="note" value="${esc(m.note)}"></label></div></fieldset>
    <fieldset class="rep-preset"><legend>Кому и что</legend>${seg('rep-preset', r.preset, REPORT.presets)}
      <p class="rep-hint" id="rep-custom" style="margin:6px 0 0" ${r.preset==='custom'?'':'hidden'}>Свой набор: галочки отмечены вручную.</p>
      <div class="rep-groups">${groups.map(([g,list])=>`<div><h4>${g}</h4>${list.map(s=>`<label class="check tap"><input type="checkbox" data-sec="${s.id}" ${on(s.id)?'checked':''}>${esc(s.title)}${s.perRoom&&S.rooms.length>1?' <span class="muted">— по помещениям</span>':''}</label>`).join('')}</div>`).join('')}</div></fieldset>
    <label class="check tap"><input type="checkbox" id="rep-mono" ${r.mono?'checked':''}>Чёрно-белая печать — зоны различаются штриховкой</label>
    <div class="rep-count" id="rep-count">Считаю листы…</div>
    <div class="rep-btns"><button class="btn tap" type="button" id="rep-prev-btn">Предпросмотр</button><button class="btn primary tap" type="button" data-rep-dl id="rep-dl">Скачать PDF</button><span class="rep-dl-hint rep-hint"></span></div>
    <div class="rep-prog" id="rep-prog" aria-live="polite"></div></div>`;
  document.body.appendChild(ov); updRepDl();
  const dlg=ov.querySelector('.rep-dlg');
  const recount=()=>{ const el=document.getElementById('rep-count'); el.textContent='Считаю листы…'; setTimeout(()=>{ try{ repPagesEst=repEstimate(); el.textContent=`Получится примерно ${repPagesEst} ${plural(repPagesEst,'лист','листа','листов')} A4`; }catch(e){ el.textContent='Не удалось посчитать листы: '+e.message; console.error(e); } }, 30); };
  ov.addEventListener('click',e=>{ if(e.target===ov) closeReport(); });
  ov.addEventListener('keydown',e=>{ if(e.key==='Escape') closeReport(); });
  document.getElementById('rep-close').addEventListener('click',closeReport);
  ov.querySelectorAll('[data-meta]').forEach(el=>el.addEventListener('input',()=>{ r.meta[el.dataset.meta]=el.value; touch(); }));
  segBind(dlg,(k,v)=>{ if(k!=='rep-preset') return; r.preset=v; r.sections=presetSections(v); ov.querySelectorAll('[data-sec]').forEach(cb=>cb.checked=!!r.sections[cb.dataset.sec]); document.getElementById('rep-custom').hidden=true; touch(); recount(); });
  ov.querySelectorAll('[data-sec]').forEach(cb=>cb.addEventListener('change',()=>{ if(r.preset!=='custom'){ r.sections=presetSections(r.preset); r.preset='custom'; }
    r.sections[cb.dataset.sec]=cb.checked; ov.querySelectorAll('[data-seg="rep-preset"] button').forEach(b=>b.setAttribute('aria-pressed','false')); document.getElementById('rep-custom').hidden=false; touch(); recount(); }));
  document.getElementById('rep-mono').addEventListener('change',e=>{ r.mono=e.target.checked; touch(); recount(); });
  document.getElementById('rep-prev-btn').addEventListener('click',openPreview);
  document.getElementById('rep-dl').addEventListener('click',downloadReport);
  recount(); setTimeout(()=>document.getElementById('rep-close').focus(),0);
}
function closeReport(){ const o=document.getElementById('rep-ov'); if(o) o.remove(); }
function setProg(t){ const p=document.getElementById('rep-prog'); if(p) p.textContent=t; const q=document.getElementById('rep-prev-prog'); if(q) q.textContent=t; }
async function downloadReport(){
  if(repBusy || !repDl) return; repBusy=true; updRepDl();
  try{
    setProg('Загружаю библиотеки и шрифты…');
    const blob=await buildReportPdf({estimate:repPagesEst, onProgress:(n,m)=>setProg(`Собираю лист ${n} из ${m}`)});
    setProg('Файл готов — подтвердите сохранение');
    try{ await repDl.save({filename:reportFileName(), data:blob}); setProg('Сохранено'); toast('Задание сохранено в PDF'); }
    catch(e){ const c=e&&e.code;
      if(c==='declined') setProg('');
      else if(c==='rate_limited') setProg('Окно сохранения уже открыто или запросов слишком много — подождите и повторите.');
      else if(c==='too_large') setProg('Файл слишком большой для сохранения здесь.');
      else setProg('Не удалось сохранить файл: '+((e&&e.message)||c||'неизвестная ошибка')); }
  } catch(e){ console.error(e); setProg('Не удалось собрать PDF: '+e.message); }
  finally{ repBusy=false; updRepDl(); }
}
function openPreview(){
  closePreview(); const r=reportState();
  const pv=document.createElement('div'); pv.className='rep-prev'; pv.id='rep-prev'; pv.setAttribute('role','dialog'); pv.setAttribute('aria-modal','true'); pv.setAttribute('aria-label','Предпросмотр задания');
  pv.innerHTML=`<div class="rep-prev-bar"><button class="btn tap" type="button" id="rep-prev-close">← Закрыть</button><span class="grow" id="rep-prev-info">Собираю предпросмотр…</span><span class="rep-prog" id="rep-prev-prog"></span><button class="btn primary tap" type="button" data-rep-dl id="rep-prev-dl">Скачать PDF</button></div>
    <div class="rep-prev-scroll" id="rep-prev-scroll"></div>`;
  document.body.appendChild(pv); updRepDl();
  document.getElementById('rep-prev-close').addEventListener('click',closePreview);
  document.getElementById('rep-prev-dl').addEventListener('click',downloadReport);
  pv.addEventListener('keydown',e=>{ if(e.key==='Escape') closePreview(); });
  setTimeout(()=>{ const sc=document.getElementById('rep-prev-scroll'); if(!sc) return;
    const host=document.createElement('div'); host.className='rep-measure'+(r.mono?' rp-mono':''); document.body.appendChild(host);
    let pages; try{ pages=paginateHtml(buildReportDoc(), host); } catch(e){ console.error(e); document.getElementById('rep-prev-info').textContent='Не удалось собрать предпросмотр: '+e.message; host.remove(); return; }
    const avail=sc.clientWidth-32;
    for(const p of pages){ const w=p.el.offsetWidth, h=p.el.offsetHeight, k=Math.min(1, avail/w);
      const wrap=document.createElement('div'); wrap.className='rep-pagewrap'+(r.mono?' rp-mono':''); wrap.style.width=(w*k)+'px'; wrap.style.height=(h*k)+'px';
      p.el.style.transform=`scale(${k})`; wrap.appendChild(p.el); sc.appendChild(wrap); }
    host.remove(); repPagesEst=pages.length;
    document.getElementById('rep-prev-info').textContent=`${pages.length} ${plural(pages.length,'лист','листа','листов')} · так примерно будет выглядеть PDF`;
    document.getElementById('rep-prev-close').focus(); }, 30);
}
function closePreview(){ const p=document.getElementById('rep-prev'); if(p) p.remove(); }
// кнопка в шапке и на шаге «Смета»
(function(){ const g=document.querySelector('nav.steps .undo'); if(!g) return;
  const b=document.createElement('button'); b.type='button'; b.className='btn small'; b.id='rep-open'; b.title='Задание на кухню в PDF'; b.setAttribute('aria-label','Задание на кухню в PDF');
  b.innerHTML='<svg width="14" height="16" viewBox="0 0 14 16" aria-hidden="true" style="flex:0 0 auto"><path d="M2 1h7l3 3v11H2z" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M4.5 8h5M4.5 10.5h5M4.5 13h3" stroke="currentColor" stroke-width="1.2"/></svg> <span>Задание PDF</span>';
  g.appendChild(b); b.addEventListener('click',openReport); })();
document.addEventListener('click',e=>{ const b=e.target.closest('[data-open-report]'); if(b) openReport(); });

</script>
<script>
/* ======================================================================
   МОИ ПРОЕКТЫ: список, меню «Проект», файл проекта (скачать / загрузить)
   ====================================================================== */
const PJ_CSS=`
.toast{z-index:80!important}
.pj-screen{position:fixed;inset:0;z-index:40;background:var(--paper);overflow:auto}
.pj-in{max-width:1080px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-left,0px)) 40px}
.pj-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.pj-head h2{margin:2px 0 0}
.pj-actions{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.pj-actions .btn,.pj-card .btn,.pj-dlg .btn,.pj-menu button{min-height:44px}
.pj-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:12px}
.pj-card{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 14px 12px;display:flex;flex-direction:column;gap:6px;position:relative}
.pj-card.last{border-color:var(--steel);box-shadow:inset 0 0 0 1px var(--steel)}
.pj-card h3{margin:0;font:600 17px/1.25 var(--f-body);letter-spacing:0;text-transform:none;color:var(--ink);overflow-wrap:anywhere}
.pj-card .org{font-size:14px;color:var(--ink-2)}
.pj-card .meta{font:500 13px var(--f-mono);color:var(--ink-2)}
.pj-card .sum{font-size:14px}
.pj-card .var{font-size:13px;color:var(--steel)}
.pj-card .nocopy{font-size:12.5px;color:var(--ink-2);font-style:italic}
.pj-card .row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
.pj-card .tag-last{align-self:flex-start;font:500 11px var(--f-body);color:var(--steel);background:var(--steel-soft);padding:2px 8px;border-radius:10px}
.pj-head .btn{white-space:normal;text-align:left;max-width:100%}
.pj-more{position:relative}
.pj-more>summary{list-style:none;display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;border:1px solid var(--rule);border-radius:var(--r);background:var(--sheet);cursor:pointer;font-size:18px}
.pj-more>summary::-webkit-details-marker{display:none}
.pj-more[open]>div{position:absolute;left:0;top:48px;z-index:3;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);box-shadow:0 8px 24px rgba(0,0,0,.18);display:flex;flex-direction:column;min-width:210px;padding:4px}
.pj-more>div button{border:0;background:transparent;text-align:left;padding:10px 12px;font:500 15px var(--f-body);color:var(--ink);border-radius:4px;cursor:pointer;min-height:44px}
.pj-more>div button:hover{background:var(--paper)}
.pj-more>div button.danger{color:var(--bad)}
.pj-inline{display:none}
@media (min-width:601px){ .pj-more{display:none} .pj-inline{display:contents} }
.pj-confirm{border-left:3px solid var(--bad);background:var(--bad-soft);padding:8px 10px;border-radius:var(--r);font-size:14px;display:flex;flex-direction:column;gap:6px}
.pj-form{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px;margin:0 0 14px;display:flex;flex-direction:column;gap:10px}
.pj-empty{color:var(--ink-2);font-size:15px;padding:22px 0}
.pj-search{max-width:420px;margin:0 0 12px}
.pj-undo{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--paper);border-radius:22px;padding:4px 6px 4px 16px;display:flex;align-items:center;gap:10px;font-size:14px;max-width:calc(100% - 32px)}
.pj-undo button{min-height:40px;border:0;background:transparent;color:var(--paper);font:600 14px var(--f-body);text-decoration:underline;cursor:pointer;padding:0 10px}
.pj-menu{position:absolute;right:0;top:calc(100% + 6px);z-index:45;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);box-shadow:0 10px 30px rgba(0,0,0,.2);display:flex;flex-direction:column;min-width:240px;padding:4px}
.pj-menu button{border:0;background:transparent;text-align:left;padding:10px 14px;font:500 15px var(--f-body);color:var(--ink);border-radius:4px;cursor:pointer}
.pj-menu button:hover,.pj-menu button:focus-visible{background:var(--paper);outline:none}
.pj-menu .mh{display:none}
.proj-menu-wrap{position:relative}
#proj-menu-btn{display:inline-flex;gap:6px;align-items:center}
@media (max-width:600px){ #proj-menu-btn span{display:none} #proj-menu-btn{min-width:44px}
  .pj-menu{position:fixed;inset:0;border-radius:0;border:0;padding:12px 16px;gap:2px;min-width:0}
  .pj-menu .mh{display:flex;justify-content:space-between;align-items:center;font:600 18px var(--f-body);margin-bottom:8px}
  .pj-menu button{font-size:17px;border-bottom:1px solid var(--grid);border-radius:0} }
.pj-ov{position:fixed;inset:0;z-index:65;background:rgba(20,28,32,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow:auto}
.pj-dlg{background:var(--sheet);color:var(--ink);border:1px solid var(--rule);border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.25);width:min(560px,100%);padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.pj-dlg h3{margin:0;font:600 18px var(--f-body);letter-spacing:0;text-transform:none;color:var(--ink)}
.pj-dlg .card{border:1px solid var(--rule);border-radius:var(--r);padding:12px;background:var(--paper)}
.pj-dlg .card b{font-size:16px}
.pj-dlg textarea{width:100%;min-height:180px;font:12px var(--f-mono)}
.pj-dlg .note{font-size:14px;color:var(--ink-2)}
.pj-dlg .warn{border-left:3px solid var(--warn);background:var(--warn-soft);padding:8px 10px;border-radius:var(--r);font-size:14px}
.pj-dlg .bad{border-left:3px solid var(--bad);background:var(--bad-soft);padding:8px 10px;border-radius:var(--r);font-size:14px}
.pj-drop{position:fixed;inset:0;z-index:90;background:rgba(46,89,100,.18);border:4px dashed var(--steel);display:flex;align-items:center;justify-content:center;pointer-events:none}
.pj-drop span{background:var(--sheet);color:var(--ink);font:600 20px var(--f-body);padding:16px 24px;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.2)}
@media (max-width:600px){ .pj-ov{padding:0} .pj-dlg{min-height:100%;border-radius:0;border:0} }
`;
(function(){ const st=document.createElement('style'); st.textContent=PJ_CSS; document.head.appendChild(st); })();

const PJ_FORMAT=1, PJ_APP='kuhnya-trapeznoy';
const fmtDT=iso=>{ if(!iso) return '—'; const d=new Date(iso); if(isNaN(d)) return '—'; return d.toLocaleDateString('ru-RU')+', '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}); };
const fmtD=iso=>{ const d=new Date(iso); return isNaN(d)?'—':d.toLocaleDateString('ru-RU'); };
function moneyShort(n){ if(n==null) return ''; if(n>=1e6) return fmt1(n/1e6)+' млн ₽'; if(n>=1e3) return fmt0(n/1e3)+' тыс. ₽'; return fmt0(n)+' ₽'; }
function safeName(t){ return String(t||'Проект').replace(/[\\/:*?"<>|\u0000-\u001f]+/g,' ').replace(/\s+/g,' ').trim().slice(0,120)||'Проект'; }

/* ---- строка состояния и плашки ---- */
let otherTabChange=false;
function updSaveState(){ const el=document.getElementById('save-state'); if(!el) return;
  if(!S.pid){ el.textContent=''; el.className='save-state'; }
  else if(!saveInfo.ok){ el.textContent='Не сохранено'; el.className='save-state bad'; }
  else el.textContent=saveInfo.at?`Сохранено в этом браузере · ${saveInfo.at.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}`:'Сохранено в этом браузере', el.className='save-state';
  updStoreBar(); }
function updStoreBar(){ const bar=document.getElementById('store-bar'); if(!bar) return; let h='';
  if(S.pid && !saveInfo.ok) h+= saveInfo.err==='quota'
    ? `<div role="alert"><span>Не удалось сохранить: в браузере закончилось место. Скачайте проект файлом и удалите ненужные.</span><button class="btn small tap" type="button" data-proj="download">Скачать файл</button><button class="btn small tap" type="button" data-proj="list">Мои проекты</button></div>`
    : `<div role="alert"><span>Не удалось сохранить проект в этом браузере. Скачайте его файлом, чтобы не потерять.</span><button class="btn small tap" type="button" data-proj="download">Скачать файл</button></div>`;
  if(otherTabChange) h+=`<div class="info" role="status"><span>Проект изменён в другой вкладке.</span><button class="btn small tap" type="button" id="pj-reload">Загрузить ту версию</button><button class="btn small tap" type="button" id="pj-reload-no">Оставить эту</button></div>`;
  bar.innerHTML=h; bar.hidden=!h;
  const r=document.getElementById('pj-reload'); r&&r.addEventListener('click',()=>{ otherTabChange=false; const d=STORE.load(S.pid); if(d) openProjectData(d,{keepStep:true, msg:'Загружена версия из другой вкладки'}); else updStoreBar(); });
  const n=document.getElementById('pj-reload-no'); n&&n.addEventListener('click',()=>{ otherTabChange=false; updStoreBar(); }); }
window.addEventListener('storage',e=>{ if(!S.pid) return;
  if(e.key===STORE.PK+S.pid && e.newValue && e.newValue!==e.oldValue){ otherTabChange=true; updStoreBar(); }
  if(e.key===STORE.IX && document.getElementById('pj-screen')) renderProjects(); });

/* ---- открыть проект ---- */
function resetUiState(){ sel=null; selRoom=null; addMode=null; editUid=null; draft=null; confirmRoomDel=false; rpOpen=false; confirmArrange=false; otherTabChange=false; }
function openProjectData(data, opts){
  opts=opts||{}; const m=migrate(data); if(!m) throw new Error('bad');
  ensureIds(m, opts.id); S=m; resetUiState();
  undoStack=[]; redoStack=[]; lastPush=0;   // история отмены — у каждого проекта своя
  if(!opts.keepStep) step=0;
  render(); lastSnap=snap(); updUndo();
  if(opts.persist){ save(); } else { STORE.setLast(S.pid); const u=S.updatedAt?new Date(S.updatedAt):null; saveInfo={ok:true, at:u&&!isNaN(u)?u:null, err:null}; updSaveState(); }
  closeProjects(); window.scrollTo({top:0}); if(opts.msg) toast(opts.msg);
}
function openProjectId(id){ const d=STORE.load(id); if(!d){ toast('Проект не найден в этом браузере'); renderProjects(); return; }
  if(S.pid && S.pid!==id) save(); try{ openProjectData(d,{id, msg:`Открыт проект «${d.name||'Без названия'}»`}); }catch(e){ toast('Не удалось открыть проект'); } }
function blankProject(name, people){
  const o=exampleData();
  Object.assign(o,{example:false, name:name||'Новая трапезная', people:Math.max(1,Math.round(people||40)), pid:'', createdAt:'', updatedAt:'', variantOf:null,
    heat:heatRecommend(Math.max(1,Math.round(people||40))), rooms:[{id:'r1', name:'Кухня', x:0, y:0, w:6, d:4, roles:ROLES.map(r=>r[0]), openings:[], points:[]}],
    cur:'r1', unitRoom:{}, links:[], res:{kw:null, ph:3, max:null, phMax:3, fit:false}, gas:{on:false, src:'main'},
    report:{meta:{parish:'', address:'', author:'', contact:'', note:''}, preset:'full', sections:{}, mono:false},
    existing:[], manual:null, prices:{}, layout:{}, inserts:[], layoutManual:false, layoutSig:'', utilities:'design'});   // новый чистый проект: сетей пока нет — проектируем
  return o; }
function createProject(data, msg){ if(S.pid) save(); data.pid=newPid(); data.createdAt=new Date().toISOString(); data.variantOf=data.variantOf||null;
  openProjectData(data,{persist:true, msg}); }
function nextVariantName(base){ const names=new Set(STORE.list().map(x=>x.name)); const root=base.replace(/ — вариант [А-Я]$/,'');
  for(const L of 'БВГДЕЖЗИКЛМНОПРСТУФХЦЧШЭЮЯ'){ const n=`${root} — вариант ${L}`; if(!names.has(n)) return {name:n, letter:L}; } return {name:root+' — вариант', letter:''}; }
function makeVariant(id){
  id=id||S.pid; if(!id) return; if(S.pid) save();
  const src=id===S.pid?JSON.parse(JSON.stringify(S)):STORE.load(id); if(!src){ toast('Проект не найден'); return; }
  const v=nextVariantName(src.name||'Проект'); src.name=v.name; src.variantOf=id; src.example=false;
  createProject(src, `Открыт вариант ${v.letter}, исходный проект сохранён`); }

/* ---- файл проекта ---- */
let dlP=null; function getDl(){ const c=window.claude; if(!c||typeof c.use!=='function') return Promise.resolve(null); if(!dlP) dlP=c.use('downloads').catch(()=>null); return dlP; }
function projectFile(data){ return JSON.stringify({app:PJ_APP, format:PJ_FORMAT, savedAt:new Date().toISOString(), project:data}, null, 1); }
function projectFileName(data){ const d=new Date(), p2=n=>String(n).padStart(2,'0'); return `${safeName(data.name)} — ${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}.json`; }
async function downloadProject(id){
  let data; if(!id || id===S.pid){ if(S.pid) save(); data=JSON.parse(JSON.stringify(S)); id=S.pid; } else data=STORE.load(id);
  if(!data){ toast('Проект не найден'); return; }
  const text=projectFile(data), name=projectFileName(data), dl=await getDl();
  if(!dl){ showJsonFallback(text, name); return; }
  try{ await dl.save({filename:name, data:text}); if(id) STORE.mark(id,{exportedAt:new Date().toISOString()}); toast('Файл проекта сохранён'); if(document.getElementById('pj-screen')) renderProjects(); }
  catch(e){ const c=e&&e.code; if(c==='declined') return;
    if(c==='rate_limited') toast('Окно сохранения уже открыто или запросов слишком много — подождите и повторите');
    else if(c==='unavailable'||c==='not_granted'||c==='capability_disabled'||c==='capability_removed') showJsonFallback(text, name);
    else toast('Не удалось сохранить файл: '+((e&&e.message)||c||'неизвестная ошибка')); } }
function pjDialog(html){ closePjDialog(); const ov=document.createElement('div'); ov.className='pj-ov'; ov.id='pj-ov';
  ov.innerHTML=`<div class="pj-dlg" role="dialog" aria-modal="true">${html}</div>`; document.body.appendChild(ov);
  ov.addEventListener('click',e=>{ if(e.target===ov) closePjDialog(); }); ov.addEventListener('keydown',e=>{ if(e.key==='Escape') closePjDialog(); });
  setTimeout(()=>{ const f=ov.querySelector('[autofocus],button'); f&&f.focus(); },0); return ov; }
function closePjDialog(){ const o=document.getElementById('pj-ov'); if(o) o.remove(); }
function showJsonFallback(text, name){
  const ov=pjDialog(`<h3>Файл проекта</h3><p class="note">Скачивание недоступно в этом просмотре — скопируйте текст и сохраните его в файл .json, например «${esc(name)}».</p>
    <textarea readonly id="pj-json" aria-label="Текст файла проекта">${esc(text)}</textarea>
    <div class="btns"><button class="btn primary" type="button" id="pj-copy">Скопировать</button><button class="btn" type="button" id="pj-close">Закрыть</button></div>`);
  ov.querySelector('#pj-close').addEventListener('click',closePjDialog);
  ov.querySelector('#pj-copy').addEventListener('click',async()=>{ const ta=ov.querySelector('#pj-json'); try{ await navigator.clipboard.writeText(ta.value); toast('Текст файла скопирован'); }catch(e){ ta.focus(); ta.select(); toast('Текст выделен — скопируйте его вручную'); } }); }

/* ---- загрузка проекта: файл, перетаскивание, текст ---- */
const NOT_PROJECT='Это не файл проекта кухни трапезной';
function parseProjectText(text){
  let o; try{ o=JSON.parse(text); }catch(e){ return {error:NOT_PROJECT}; }
  if(!o||typeof o!=='object') return {error:NOT_PROJECT};
  let raw=o, newer=false;
  if(o.app===PJ_APP){ if(!(+o.format>=1)) return {error:NOT_PROJECT}; newer=+o.format>PJ_FORMAT; raw=o.project; if(!raw||typeof raw!=='object') return {error:NOT_PROJECT}; }
  else if(!(o.v===1||o.v===2)) return {error:NOT_PROJECT};
  if(raw.v===2 && !Array.isArray(raw.rooms) && !raw.room) return {error:NOT_PROJECT};
  if(raw.v===1 && !raw.room && !raw.people) return {error:NOT_PROJECT};
  let m; try{ m=migrate(JSON.parse(JSON.stringify(raw))); }catch(e){ m=null; }
  if(!m) return {error: newer?'Файл сохранён более новой версией приложения, и открыть его не получилось':NOT_PROJECT};
  return {data:JSON.parse(JSON.stringify(m)), newer, savedAt:o.savedAt||null};
}
function importProjectText(text, fname){
  const r=parseProjectText(text);
  if(r.error){ pjDialog(`<h3>Не получилось открыть</h3><p class="bad">${esc(r.error)}.</p>${fname?`<p class="note">Файл: ${esc(fname)}</p>`:''}<div class="btns"><button class="btn" type="button" id="pj-close">Понятно</button></div>`).querySelector('#pj-close').addEventListener('click',closePjDialog); return; }
  const d=r.data, has=d.pid?STORE.meta(d.pid):null, upd=d.updatedAt||r.savedAt;
  const browserNewer = has && has.updatedAt && upd && new Date(has.updatedAt)>new Date(upd);
  const org=d.report&&d.report.meta&&d.report.meta.parish;
  const ov=pjDialog(`<h3>Загрузить проект</h3>
    ${r.newer?`<p class="warn">Файл сохранён более новой версией приложения. Открою то, что понятно этой версии.</p>`:''}
    <div class="card"><b>${esc(d.name||'Без названия')}</b>${org?`<div class="note">${esc(org)}</div>`:''}<div class="note">${esc([`${fmt0(d.people)} ${plural(d.people,'человек','человека','человек')}`, upd?`изменён ${fmtD(upd)}`:'', `${d.rooms?d.rooms.length:1} ${plural(d.rooms?d.rooms.length:1,'помещение','помещения','помещений')}`].filter(Boolean).join(' · '))}</div></div>
    ${has?`<p class="warn">${browserNewer?`В браузере есть более новая версия (изменена ${esc(fmtDT(has.updatedAt))}). «Заменить» вернёт проект к версии из файла.`:`Этот проект уже есть в браузере: «${esc(has.name)}», изменён ${esc(fmtDT(has.updatedAt))}.`}</p>
      <div class="btns"><button class="btn primary tap" type="button" id="pj-replace">Заменить</button><button class="btn tap" type="button" id="pj-copyopen">Открыть как копию</button><button class="btn tap" type="button" id="pj-cancel">Отмена</button></div>`
    :`<div class="btns"><button class="btn primary tap" type="button" id="pj-open" autofocus>Открыть</button><button class="btn tap" type="button" id="pj-cancel">Отмена</button></div>`}`);
  const done=(data,msg)=>{ closePjDialog(); if(S.pid) save(); openProjectData(data,{persist:true, msg}); };
  ov.querySelector('#pj-cancel').addEventListener('click',closePjDialog);
  const op=ov.querySelector('#pj-open'); op&&op.addEventListener('click',()=>{ const x=JSON.parse(JSON.stringify(d)); x.pid=x.pid||newPid(); done(x,`Проект «${x.name}» загружен`); });
  const rp=ov.querySelector('#pj-replace'); rp&&rp.addEventListener('click',()=>{ done(JSON.parse(JSON.stringify(d)),`Проект «${d.name}» загружен`); });
  const cp=ov.querySelector('#pj-copyopen'); cp&&cp.addEventListener('click',()=>{ const x=JSON.parse(JSON.stringify(d)); x.pid=newPid(); x.name=(x.name||'Проект')+' (копия)'; x.createdAt=new Date().toISOString(); done(x,`Проект «${x.name}» загружен`); });
}
function importProjectFile(file){
  if(!file) return;
  if(file.size>5*1024*1024){ importProjectText('',file.name); return; }
  const rd=new FileReader(); rd.onload=()=>importProjectText(String(rd.result||''), file.name); rd.onerror=()=>importProjectText('', file.name); rd.readAsText(file);
}
const pjFile=document.createElement('input'); pjFile.type='file'; pjFile.accept='.json,application/json'; pjFile.hidden=true; pjFile.id='pj-file';
document.body.appendChild(pjFile); pjFile.addEventListener('change',()=>{ const f=pjFile.files&&pjFile.files[0]; pjFile.value=''; importProjectFile(f); });
function pickProjectFile(){ pjFile.click(); }
// перетаскивание файла в окно
let dragDepth=0;
const hasFiles=e=>e.dataTransfer && [...(e.dataTransfer.types||[])].includes('Files');
window.addEventListener('dragenter',e=>{ if(!hasFiles(e)) return; e.preventDefault(); dragDepth++; if(!document.getElementById('pj-drop')){ const d=document.createElement('div'); d.className='pj-drop'; d.id='pj-drop'; d.innerHTML='<span>Отпустите, чтобы открыть проект</span>'; document.body.appendChild(d); } });
window.addEventListener('dragover',e=>{ if(hasFiles(e)){ e.preventDefault(); e.dataTransfer.dropEffect='copy'; } });
window.addEventListener('dragleave',e=>{ if(!hasFiles(e)) return; dragDepth=Math.max(0,dragDepth-1); if(!dragDepth){ const d=document.getElementById('pj-drop'); d&&d.remove(); } });
window.addEventListener('drop',e=>{ if(!hasFiles(e)) return; e.preventDefault(); dragDepth=0; const d=document.getElementById('pj-drop'); d&&d.remove(); const f=e.dataTransfer.files&&e.dataTransfer.files[0]; importProjectFile(f); });

/* ---- экран «Мои проекты» ---- */
let pjQuery='', pjNewOpen=false, pjConfirmDel=null, pjPending=null;   // pjPending: {id, name, timer}
function staleCopy(p){ if(!p.exportedAt) return true; const e=new Date(p.exportedAt), u=new Date(p.updatedAt||0); return u>e && (Date.now()-e)>3*24*3600*1000; }
function openProjects(opts){ opts=opts||{}; closeProjMenu(); if(opts.newForm) pjNewOpen=true;
  let sc=document.getElementById('pj-screen'); if(!sc){ sc=document.createElement('div'); sc.className='pj-screen'; sc.id='pj-screen'; sc.setAttribute('role','region'); sc.setAttribute('aria-label','Мои проекты'); document.body.appendChild(sc); document.body.style.overflow='hidden'; }
  renderProjects(); if(opts.newForm){ const n=document.getElementById('pj-new-name'); n&&n.focus(); } }
function closeProjects(){ const sc=document.getElementById('pj-screen'); if(sc){ sc.remove(); document.body.style.overflow=''; } pjNewOpen=false; pjConfirmDel=null; }
function renderProjects(){
  const sc=document.getElementById('pj-screen'); if(!sc) return;
  const last=STORE.last(), all=STORE.list().filter(p=>!pjPending||p.id!==pjPending.id);
  const names=new Map(all.map(p=>[p.id,p.name]));
  let list=all; if(pjQuery){ const q=pjQuery.toLowerCase(); list=all.filter(p=>(p.name||'').toLowerCase().includes(q)||(p.org||'').toLowerCase().includes(q)); }
  const li=list.findIndex(p=>p.id===last); if(li>0) list.unshift(list.splice(li,1)[0]);
  const card=p=>{ const isLast=p.id===last && !!S.pid && S.pid===p.id;
    const sum=[p.people!=null?`${fmt0(p.people)} ${plural(p.people,'человек','человека','человек')}`:'', p.kw!=null?`нужно ${fmt0(p.kw)} кВт`:'', p.total!=null?moneyShort(p.total):''].filter(Boolean).join(' · ');
    const del=pjConfirmDel===p.id;
    const actions=`<button class="btn tap" type="button" data-pa="variant" data-id="${p.id}">Сделать вариант</button><button class="btn tap" type="button" data-pa="download" data-id="${p.id}">Скачать файл</button><button class="btn tap danger" type="button" data-pa="delask" data-id="${p.id}">Удалить</button>`;
    return `<article class="pj-card${isLast?' last':''}" data-card="${p.id}">${isLast?'<span class="tag-last">последний открытый</span>':''}
      <h3>${esc(p.name||'Без названия')}</h3>${p.org?`<div class="org">${esc(p.org)}</div>`:''}
      <div class="meta">изменён ${esc(fmtDT(p.updatedAt))}</div>${sum?`<div class="sum">${esc(sum)}</div>`:''}
      ${p.variantOf?`<div class="var">вариант от «${esc(names.get(p.variantOf)||'удалённого проекта')}»</div>`:''}
      ${staleCopy(p)?'<div class="nocopy">копия файлом не сохранялась</div>':''}
      ${del?`<div class="pj-confirm" role="alert"><span>Удалить «${esc(p.name)}» из этого браузера? Если файла проекта нет, восстановить его будет нельзя.</span><div class="btns"><button class="btn danger tap" type="button" data-pa="del" data-id="${p.id}">Удалить</button><button class="btn tap" type="button" data-pa="delno">Отмена</button></div></div>`
      :`<div class="row"><button class="btn primary tap" type="button" data-pa="open" data-id="${p.id}">${isLast?'Продолжить':'Открыть'}</button><span class="pj-inline">${actions}</span>
        <details class="pj-more"><summary aria-label="Ещё действия с проектом «${esc(p.name)}»">⋯</summary><div>${actions.replace(/btn tap danger/,'danger').replace(/btn tap/g,'')}</div></details></div>`}
    </article>`; };
  sc.innerHTML=`<div class="pj-in">
    <div class="pj-head"><div><div class="kicker">Кухня трапезной</div><h2>Мои проекты</h2></div>${S.pid&&STORE.meta(S.pid)&&!(pjPending&&pjPending.id===S.pid)?`<button class="btn tap" type="button" data-pa="back">← Вернуться к «${esc(S.name)}»</button>`:''}</div>
    <div class="pj-actions"><button class="btn primary tap" type="button" data-pa="new">Новый проект</button><button class="btn tap" type="button" data-pa="upload">Загрузить проект</button><button class="btn tap" type="button" data-pa="example">Открыть пример</button></div>
    ${pjNewOpen?`<form class="pj-form" id="pj-new-form"><div class="fields"><label class="field"><span>Название</span><input id="pj-new-name" type="text" required placeholder="Например, трапезная храма Покрова"></label>${num('pj-new-people','Человек за одной трапезой',40,1,1,600)}</div>
      <p class="hint" style="margin:0">Чистый проект: одна кухня 6 × 4 м, тепловое — по числу людей. Помещения, двери и оборудование добавите сами.</p>
      <div class="btns"><button class="btn primary tap" type="submit">Создать</button><button class="btn tap" type="button" data-pa="newno">Отмена</button></div></form>`:''}
    ${all.length>6?`<input class="pj-search" type="search" id="pj-q" placeholder="Поиск по названию и приходу" aria-label="Поиск проектов" value="${esc(pjQuery)}">`:''}
    ${all.length?`<div class="pj-list">${list.map(card).join('')||'<p class="pj-empty">Ничего не нашлось.</p>'}</div>`
      :`<p class="pj-empty">Проектов пока нет. Создайте новый, загрузите файл проекта или откройте пример, чтобы посмотреть, как всё устроено.</p>`}
    <p class="hint" style="margin-top:18px">Проекты хранятся в этом браузере. Чтобы не потерять проект или передать его, скачайте его файлом.</p></div>`;
  sc.querySelectorAll('[data-pa]').forEach(b=>b.addEventListener('click',()=>pjAction(b.dataset.pa, b.dataset.id)));
  const q=document.getElementById('pj-q'); q&&q.addEventListener('input',()=>{ pjQuery=q.value; const pos=q.selectionStart; renderProjects(); const q2=document.getElementById('pj-q'); q2.focus(); q2.setSelectionRange(pos,pos); });
  const f=document.getElementById('pj-new-form'); f&&f.addEventListener('submit',e=>{ e.preventDefault(); const n=document.getElementById('pj-new-name').value.trim()||'Новая трапезная', pp=parseFloat(document.getElementById('pj-new-people').value)||40;
    pjNewOpen=false; createProject(blankProject(n,pp), `Создан проект «${n}»`); });
}
function pjAction(a, id){
  if(a==='open'){ if(id===S.pid){ closeProjects(); return; } openProjectId(id); }
  else if(a==='back') closeProjects();
  else if(a==='new'){ pjNewOpen=true; renderProjects(); const n=document.getElementById('pj-new-name'); n&&n.focus(); }
  else if(a==='newno'){ pjNewOpen=false; renderProjects(); }
  else if(a==='upload') pickProjectFile();
  else if(a==='example'){ const d=exampleData(); d.name='Пример — трапезная воскресной школы'; d.example=false; createProject(d,'Открыт пример — это отдельный проект, его можно менять'); }
  else if(a==='variant') makeVariant(id);
  else if(a==='download') downloadProject(id);
  else if(a==='delask'){ pjConfirmDel=id; renderProjects(); }
  else if(a==='delno'){ pjConfirmDel=null; renderProjects(); }
  else if(a==='del'){ pjConfirmDel=null; deleteWithUndo(id); }
}
function finishPending(){ if(!pjPending) return; clearTimeout(pjPending.timer); const id=pjPending.id; pjPending=null; STORE.remove(id); const u=document.getElementById('pj-undo'); u&&u.remove();
  if(S.pid===id){ S.pid=''; saveInfo={ok:true,at:null,err:null}; updSaveState(); } }
function deleteWithUndo(id){
  finishPending();
  const meta=STORE.meta(id); if(!meta) return;
  if(S.pid===id){ save(); }
  pjPending={id, name:meta.name, timer:setTimeout(finishPending, 10000)};
  renderProjects();
  const u=document.createElement('div'); u.className='pj-undo'; u.id='pj-undo'; u.setAttribute('role','status');
  u.innerHTML=`<span>Проект «${esc(meta.name)}» удалён</span><button type="button" id="pj-undo-btn">Вернуть</button>`; document.body.appendChild(u);
  u.querySelector('#pj-undo-btn').addEventListener('click',()=>{ if(!pjPending) return; clearTimeout(pjPending.timer); pjPending=null; u.remove(); renderProjects(); toast('Проект возвращён'); });
}

/* ---- меню «Проект» ---- */
function openProjMenu(){ const w=document.querySelector('.proj-menu-wrap'); if(!w||document.getElementById('proj-menu')) return;
  const m=document.createElement('div'); m.className='pj-menu'; m.id='proj-menu'; m.setAttribute('role','menu');
  m.innerHTML=`<div class="mh"><span>Проект</span><button type="button" class="btn tap" data-pm="close" aria-label="Закрыть меню">✕</button></div>
    ${[['list','Мои проекты'],['new','Новый проект'],['upload','Загрузить проект'],['download','Скачать файл проекта'],['variant','Сделать вариант']].map(([k,t])=>`<button type="button" role="menuitem" data-pm="${k}">${t}</button>`).join('')}`;
  w.appendChild(m); document.getElementById('proj-menu-btn').setAttribute('aria-expanded','true');
  m.querySelectorAll('[data-pm]').forEach(b=>b.addEventListener('click',()=>{ const k=b.dataset.pm; closeProjMenu();
    if(k==='list') openProjects(); if(k==='new') openProjects({newForm:true}); if(k==='upload') pickProjectFile(); if(k==='download') downloadProject(); if(k==='variant') makeVariant(); }));
  m.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeProjMenu(); document.getElementById('proj-menu-btn').focus(); } });
  setTimeout(()=>{ const f=m.querySelector('[data-pm="list"]'); f&&f.focus(); },0); }
function closeProjMenu(){ const m=document.getElementById('proj-menu'); if(m){ m.remove(); const b=document.getElementById('proj-menu-btn'); b&&b.setAttribute('aria-expanded','false'); } }
document.getElementById('proj-menu-btn').addEventListener('click',e=>{ e.stopPropagation(); if(document.getElementById('proj-menu')) closeProjMenu(); else openProjMenu(); });
document.addEventListener('click',e=>{ const m=document.getElementById('proj-menu'); if(m && !e.target.closest('.proj-menu-wrap')) closeProjMenu();
  const b=e.target.closest('[data-proj]'); if(b){ const k=b.dataset.proj; if(k==='download') downloadProject(); if(k==='upload') pickProjectFile(); if(k==='list') openProjects(); } });

// пока открыт список проектов, горячие клавиши проекта (отмена, шаги) не работают
window.addEventListener('keydown',e=>{ if(document.getElementById('pj-screen') && (e.ctrlKey||e.metaKey||e.altKey) && !/^(INPUT|TEXTAREA|SELECT)$/.test((e.target||{}).tagName||'')) e.stopImmediatePropagation(); }, true);
// при запуске — экран «Мои проекты»
if(S.pid && S.updatedAt){ const u=new Date(S.updatedAt); if(!isNaN(u)) saveInfo.at=u; }
updSaveState();
openProjects();

</script>
<script>
/* ======================================================================
   КЛАВИАТУРА И ФОКУС — одно правило на всё приложение
   Enter — применить и остаться в поле (текст выделен); Tab — применить и перейти дальше;
   Esc — вернуть набранное, а если ничего не набрано — закрыть панель или форму.
   Числа применяются только по Enter, Tab или уходу из поля, запятая = точка.
   После любой перерисовки фокус, курсор и прокрутка возвращаются туда же.
   ====================================================================== */
const KBD_CSS=`
input.just-ok,select.just-ok{border-color:var(--ok)!important;box-shadow:0 0 0 2px var(--ok-soft)}
.ok-tick{display:inline-block;margin-left:6px;color:var(--ok);font:700 14px var(--f-body)}
label .ok-tick{position:absolute;right:8px;top:50%;transform:translateY(-50%);pointer-events:none}
.kbd-host{position:relative}
input[aria-invalid="true"]{border-color:var(--bad)!important;background:var(--bad-soft)!important}
.field-err-msg,.field-note{display:block;font-size:12.5px;line-height:1.35;margin-top:3px;font-weight:500}
.field-err-msg{color:var(--bad)}
.field-note{color:var(--warn)}
#plan .flash, #plan .flash *{stroke:var(--accent)!important}
#plan polygon.flash, #plan rect.flash{fill:var(--accent)!important;fill-opacity:.28!important}
#plan g.flash circle{stroke-width:7!important}
#plan rect.rm-bg.flash{fill:var(--accent-soft)!important;fill-opacity:.9!important;stroke:var(--accent)!important;stroke-width:4px}
`;
(function(){ const st=document.createElement('style'); st.textContent=KBD_CSS; document.head.appendChild(st); })();

/* ---- стабильный ключ элемента: id или data-атрибуты ---- */
const qv=v=>String(v).replace(/["\\]/g,'\\$&');
function elKey(el){
  if(!el||el===document.body||!el.tagName) return null;
  if(el.id) return '#'+CSS.escape(el.id);
  const at=[...el.attributes].filter(a=>a.name.startsWith('data-')&&!['data-num','data-optional'].includes(a.name));
  const seg=el.closest('[data-seg]');
  if(!at.length && !(seg&&seg!==el)) return null;
  let sel=el.tagName.toLowerCase()+at.map(a=>`[${a.name}="${qv(a.value)}"]`).join('');
  if(seg&&seg!==el) sel=`[data-seg="${qv(seg.dataset.seg)}"] `+sel;
  return sel;
}
function findKey(k){ if(!k) return null; try{ return document.querySelector(k); }catch(e){ return null; } }

/* ---- перерисовка с сохранением фокуса; по 'change' — на следующий тик ---- */
let renderDefer=false, renderQueued=false, afterRender=[];
const renderRaw=render;
function captureFocus(){
  const a=document.activeElement, inApp=a&&(main.contains(a)||a.closest('nav.steps')||a.closest('header.app'));
  const st={key:inApp?elKey(a):null, sy:window.scrollY, sx:window.scrollX, pb:null, ss:null, se:null};
  try{ if(inApp&&a.tagName==='INPUT'&&a.type==='text'){ st.ss=a.selectionStart; st.se=a.selectionEnd; } }catch(e){}
  const pb=document.querySelector('.plan-box'); if(pb) st.pb=[pb.scrollLeft,pb.scrollTop];
  return st;
}
function restoreFocus(st){
  if(st.key){ const el=findKey(st.key); if(el && el!==document.activeElement){ try{ el.focus({preventScroll:true}); if(st.ss!=null && el.setSelectionRange) el.setSelectionRange(st.ss,st.se); }catch(e){} } }
  const pb=document.querySelector('.plan-box'); if(pb&&st.pb){ pb.scrollLeft=st.pb[0]; pb.scrollTop=st.pb[1]; }
  if(Math.abs(window.scrollY-st.sy)>1) window.scrollTo(st.sx, st.sy);
}
function doRender(){ const st=captureFocus(); renderRaw(); restoreFocus(st); showFieldMsgs(); const q=afterRender; afterRender=[]; q.forEach(f=>{ try{ f(); }catch(e){} }); }
render=function(){ if(renderDefer){ if(!renderQueued){ renderQueued=true; setTimeout(()=>{ renderQueued=false; doRender(); },0); } return; } doRender(); };

/* ---- строки под полями: ограничения и ошибки ---- */
function noteHost(el){ return el.closest('label')||el.parentElement; }
function showFieldMsgs(){
  document.querySelectorAll('.field-note[data-auto]').forEach(n=>n.remove());
  for(const [k,msg] of Object.entries(fieldMsgs)){ const el=findKey(k); if(!el) continue; const n=document.createElement('small'); n.className='field-note'; n.dataset.auto='1'; n.setAttribute('role','status'); n.textContent=msg;
    const h=noteHost(el); if(el.nextSibling && h.contains(el)) el.after(n); else h.appendChild(n); }
}
function setFieldError(el,msg){ clearFieldError(el); el.setAttribute('aria-invalid','true'); const n=document.createElement('small'); n.className='field-err-msg'; n.id='err-'+Math.random().toString(36).slice(2,8); n.setAttribute('role','alert'); n.textContent=msg; el.after(n); el.setAttribute('aria-describedby',n.id); typeof navIssRefresh==='function'&&navIssRefresh(); }

function flashOk(el){ if(!el) return; el.classList.add('just-ok'); const h=noteHost(el); let t=null;
  if(h && h.tagName==='LABEL'){ h.classList.add('kbd-host'); t=document.createElement('span'); t.className='ok-tick'; t.setAttribute('aria-hidden','true'); t.textContent='✓'; h.appendChild(t); }
  setTimeout(()=>{ el.classList.remove('just-ok'); t&&t.remove(); },1000); }
// подсветка изменённого элемента на плане
function flashPlanFor(el){
  let sel=null; const d=el.dataset||{};
  if(d.chain) sel=`#plan [data-op="${qv(d.chain.split(':')[0])}"]`;
  else if(d.pchain) sel=`#plan [data-pt="${qv(d.pchain.split(':')[0])}"]`;
  else if((d.of||d.pf) && selRoom) sel=selRoom.k==='op'?`#plan [data-op="${qv(selRoom.id)}"]`:`#plan [data-pt="${qv(selRoom.id)}"]`;
  else if(['rw','rd','rname'].includes(el.id)) sel=`#plan [data-rbg="${qv(S.cur)}"]`;
  if(!sel) return; setTimeout(()=>{ document.querySelectorAll(sel).forEach(n=>{ n.classList.add('flash'); setTimeout(()=>n.classList.remove('flash'),1000); }); },25);
}

/* ---- числа: разбор, пределы, необязательные поля ---- */
const OPTIONAL_NUM=['#kw','#kwmax','#it-kw','#it-gkw','[data-pf="hmm"]','[data-pchain$=":h"]','[data-price]'];
function isOptional(el){ return el.hasAttribute('data-optional') || OPTIONAL_NUM.some(s=>el.matches(s)); }
function fieldLabel(el){ const l=el.closest('label'); let t=el.getAttribute('aria-label')||'';
  if(l){ const sp=l.querySelector('span'); if(sp) t=sp.textContent.trim(); }
  return (t||'Значение').replace(/\s*,\s*мм$/,'').replace(/,\s*(м|кВт|л|%|м\/с)$/,''); }
function unitOf(el){ const l=el.closest('label'); const t=((l&&l.querySelector('span'))?l.querySelector('span').textContent:el.getAttribute('aria-label')||''); const m=/,\s*(мм|м|кВт|л|%|м\/с)\s*$/.exec(t.trim()); return m?' '+m[1]:(el.matches('[data-chain],[data-pchain]')?' мм':''); }
const nfmt=v=>Number(v).toLocaleString('ru-RU',{maximumFractionDigits:2});
function checkNum(el){
  const raw=el.value.trim().replace(/\s+/g,'').replace(',', '.');
  const v=Number(raw); const mn=el.getAttribute('min'), mx=el.getAttribute('max');
  const lo=mn!=null&&mn!==''?Number(mn):null, hi=mx!=null&&mx!==''?Number(mx):null, u=unitOf(el);
  const range = lo!=null&&hi!=null ? `от ${nfmt(lo)} до ${nfmt(hi)}${u}` : lo!=null ? `не меньше ${nfmt(lo)}${u}` : hi!=null ? `не больше ${nfmt(hi)}${u}` : 'число';
  // размеры помещения в мм: число меньше 100 — метры по старой привычке (поле переведёт в мм), 100–999 — слишком маленькое помещение

  if(raw===''){ return isOptional(el)?{ok:true, value:''}:{ok:false, msg:rules?`Впишите число. Допустимо ${range}`:`${fieldLabel(el)}: впишите число`}; }
  if(!/^-?\d*\.?\d+$/.test(raw) || !isFinite(v)) return {ok:false, msg:rules?`Допустимо ${range}`:`${fieldLabel(el)} — ${range}`};
  if((lo!=null&&v<lo-1e-9)||(hi!=null&&v>hi+1e-9)) return {ok:false, msg:rules?`Допустимо ${range}`:`${fieldLabel(el)} — ${range}`};
  return {ok:true, value:raw};
}

/* ---- значения во время набора не применяются ---- */
document.addEventListener('input',e=>{ const t=e.target; if(!t||!t.matches) return;
  if(!t.__commit && t.matches('input,textarea')){ const k=elKey(t); if(k&&fieldMsgs[k]){ delete fieldMsgs[k]; const h=noteHost(t); h&&h.querySelectorAll('.field-note[data-auto]').forEach(n=>n.remove()); } }
  if(t.matches('input[data-num]')){ if(t.__commit) return; clearFieldError(t); e.stopImmediatePropagation(); } }, true);

// фиксация значения (Tab, уход из поля, Enter): проверка, запятая, затем — обычные обработчики поля
document.addEventListener('change',e=>{
  const t=e.target; if(!t||!t.matches) return;
  renderDefer=true; setTimeout(()=>{ renderDefer=false; },0);
  const k=elKey(t); if(k && fieldMsgs[k]) delete fieldMsgs[k];
  if(t.matches('input[data-num]')){
    const inForm=!!t.closest('[data-enter]');
    const r=checkNum(t);
    if(!r.ok){ if(inForm) return;   // форма проверяет обязательные поля сама при сохранении
      e.stopImmediatePropagation(); setFieldError(t,r.msg); setTimeout(()=>{ if(document.contains(t)){ t.focus(); try{ t.select(); }catch(_){} } },0); return; }
    clearFieldError(t); if(t.value!==r.value) t.value=r.value;
    t.__commit=true; try{ t.dispatchEvent(new Event('input',{bubbles:true})); } finally{ t.__commit=false; }
  }
  if(t.matches('input:not([type=checkbox]):not([type=radio]),select') && !t.closest('[data-enter]') && !t.closest('.rep-ov,.pj-ov,.pj-screen')){ const key=k; flashPlanFor(t);
    setTimeout(()=>{ const el=findKey(key)||t; if(document.contains(el)) flashOk(el); },25); }
  t.__focusVal=t.value;
}, true);

/* ---- клавиши ---- */
// клавиши плана работают, когда фокус не в поле ввода и не открыты настройки, выгрузка, проекты
function planKeysOn(e){ const t=e.target, tag=(t&&t.tagName)||'';
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(tag) || (t&&t.isContentEditable) || (t&&t.closest&&t.closest('.gap-ed'))) return false;
  if(document.querySelector('.set-ov,.rep-ov,.pj-ov,.rep-prev,.pj-screen')) return false;
  return true; }
const CLOSE_ORDER=['#hrec-no','#desel','#it-cancel','#arrange-no','#room-del-no','#edits-reset-no','#add-cancel','#rs-no','#rmp-close','#rmp-done'];
document.addEventListener('keydown',e=>{
  const t=e.target, tag=(t&&t.tagName)||'';
  const overlay=t&&t.closest&&t.closest('.rep-ov,.pj-ov,.rep-prev,.pj-screen,.pj-menu,.set-ov');
  if(e.key==='Enter' && !e.ctrlKey && !e.metaKey && !e.altKey && tag==='INPUT' && !['checkbox','radio','button','submit','file','search','range','color'].includes(t.type)){
    const form=t.closest('[data-enter]');
    if(form){ e.preventDefault(); form.querySelectorAll('input[data-num]').forEach(x=>{ x.value=x.value.trim().replace(',', '.'); });
      const b=document.getElementById(form.dataset.enter); b&&b.click(); return; }
    if(t.closest('form')) return;              // настоящая форма — отправится сама
    e.preventDefault();
    const key=elKey(t), changed=t.value!==t.__focusVal;

    return;
  }

    if(wallDrag){ e.preventDefault(); e.stopImmediatePropagation(); wallDragFinish(true); return; }
    if((tag==='INPUT'||tag==='TEXTAREA') && t.__focusVal!=null && t.value!==t.__focusVal){ e.preventDefault(); e.stopImmediatePropagation(); t.value=t.__focusVal; clearFieldError(t); try{ t.select(); }catch(_){} return; }
    if(overlay) return;                        // окна выгрузки и проектов закрываются своими обработчиками
    for(const s of CLOSE_ORDER){ const b=document.querySelector(s); if(b && !b.disabled && b.offsetParent!==null){ e.preventDefault(); b.click(); return; } }
    // Esc снимает выделение аппарата на плане (карточку на телефоне закрывает модуль масштаба)
    if(planKeysOn(e) && step===5 && planMode==='equip' && sel && !document.getElementById('psheet')){ e.preventDefault(); sel=null; render(); }
    return;
  }
  // R / Shift+R — повернуть выбранный аппарат; Delete и Backspace — аппарат в резерв, проём или точку удалить (как кнопки панели)
  if(planKeysOn(e) && !e.ctrlKey && !e.metaKey && !e.altKey){
    const equip=step===5 && planMode==='equip' && sel && S.layout[sel] && typeof planAct==='function';
    if(e.code==='KeyR' && equip){ e.preventDefault(); planAct(e.shiftKey?'rotb':'rot'); return; }
    if(e.key==='Delete'||e.key==='Backspace'){
      if(equip){ e.preventDefault(); planAct('off'); return; }
      const rooms=step===1||step===2||(step===5&&planMode!=='equip'), d=document.getElementById('del-room');
      if(rooms && selRoom && d && !d.disabled && d.offsetParent!==null){ e.preventDefault(); d.click(); return; } }
  }
  // стрелки на плане двигают выбранное оборудование (как кнопки ← ↑ ↓ →)
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key) && !e.altKey && !e.ctrlKey && !e.metaKey && !overlay && !(t&&t.closest&&t.closest('.gap-ed')) && step===5 && planMode==='equip' && sel && !/^(INPUT|TEXTAREA|SELECT)$/.test(tag)){
    const st=e.shiftKey?0.1:0.01, d={ArrowLeft:[-st,0],ArrowRight:[st,0],ArrowUp:[0,-st],ArrowDown:[0,st]}[e.key];
    if(typeof nudgeSel==='function'){ e.preventDefault(); nudgeSel(d[0],d[1]); }
  }
});

</script>
<script>
/* ======================================================================
   РАЗМЕРНЫЕ ПРИВЯЗКИ ОБОРУДОВАНИЯ
   Цепочка вдоль каждой стены: аппараты и промежутки от угла до угла, сумма = длина стены.
   Аппарат спиной к стене — его ширина по фронту (жирным); угловой, касающийся стены боком, — глубина.
   Отодвинутые от своей стены до 300 мм — в цепочке, с выноской «отступ». Остальные — «острова»:
   две привязки от ближайших стен. Настенное — только у выбранного и в таблице PDF.
   ====================================================================== */
const DIM_TOL=0.01, DIM_OFF=0.3;
// стены — через геометрический слой (длина, расстояние от стены, проекция на стену)
const SIDE_LEN=(room,s)=>wallLen(room,s);
function sideDist(b,s,room){ return backDist(room,s,b); }
function sideSpan(b,s,room){ return spanOnWall(room,s,b); }
const isVert=(room,s)=>wallById(room,s).axis==='v';
const nearSide=(room,s)=>{ const w=wallById(room,s); return w.nx>0||w.ny>0; };   // стена, от которой «наружу» — к меньшим координатам (верх, лево)
const r3=v=>Math.round(v*1000)/1000;
// цепочки по стенам, острова, настенное
function equipChains(room, units, layout){
  const W=room.w, D=room.d, L=layout||S.layout;
  const placed=units.filter(u=>L[u.key]).map(u=>{ const p=L[u.key], b=bbox(u.c,p); return {u, p, b, back:posAng(p)?p.sw:wallOfRect(room,b,p.rot)}; });
  const floor=placed.filter(x=>x.u.c.mount==='floor'), wall=placed.filter(x=>x.u.c.mount==='wall');
  const sides={}, inChain=new Set(), offsets=[];
  for(const s of roomWalls(room).map(w=>w.id)){
    const len=SIDE_LEN(room,s), its=[];
    for(const x of floor){ const d=unitWallDist(room,s,x.u.c,x.p), bold=x.back===s;
      if((bold && d<=DIM_OFF+1e-6) || (!bold && d<=DIM_TOL)){ const [a,e]=unitWallSpan(room,s,x.u.c,x.p), am=Math.round(Math.max(0,a)*1000), sz=Math.round((e-a)*1000); its.push({a:am/1000, e:Math.min(len,(am+sz)/1000), sz:sz/1000, x, bold, d:posAng(x.p)&&bold?0:d}); inChain.add(x.u.key);   // целые мм
        if(bold && d>0.005) offsets.push({x, s, d}); } }
    its.sort((p,q)=>p.a-q.a||q.e-p.e);
    const segs=[]; let cur=0;
    for(const it of its){
      if(it.a>cur+DIM_TOL){ segs.push({a:cur, e:it.a, kind:'gap'}); cur=it.a; }
      if(it.e>cur+DIM_TOL){ segs.push({a:cur, e:it.e, kind:'unit', x:it.x, bold:it.bold, d:it.d, sz:it.sz}); cur=it.e; }
      else if(it.e>cur) cur=it.e;
    }
    if(len-cur>DIM_TOL) segs.push({a:cur, e:len, kind:'gap'});
    else if(segs.length) segs[segs.length-1].e=len;
    if(its.length) sides[s]=segs;
  }

  return {sides, islands, offsets, floor, wall, placed};
}
// отдельно стоящий: ближайшая стена по горизонтали и по вертикали (при равенстве — левая, верхняя)
function islandOf(x,room){ const b=x.b, ws=roomWalls(room), pick=ax=>{ let best=null; for(const w of ws.filter(w=>w.axis===ax).sort((a,c)=>(ax==='v'?c.nx-a.nx:c.ny-a.ny))){ const d=backDist(room,w,b); if(!best||d<best.d) best={s:w.id, d}; } return best; };
  return {x, h:pick('v'), v:pick('h')}; }
// где стоит аппарат: у стены (спиной, отступ ≤ 300 мм) или отдельно
function unitPlace(u, room, layout){ const L=layout||S.layout, p=L[u.key]; if(!p) return null; const b=bbox(u.c,p); if(posAng(p)&&p.sw) return {kind:'skew', s:p.sw, b, d:0, a:unitWallSpan(room,p.sw,u.c,p)[0]}; const back=wallOfRect(room,b,p.rot);
  if(back && sideDist(b,back,room)<=DIM_OFF+1e-6) return {kind:'wall', s:back, b, d:sideDist(b,back,room)};
  if(u.c.mount==='wall'){ const ds=roomWalls(room).map(w=>w.id).map(s=>[s,sideDist(b,s,room)]).sort((a,c)=>a[1]-c[1]); return {kind:'wall', s:ds[0][0], b, d:ds[0][1]}; }
  return {kind:'island', b}; }
// соседи вдоль стены: допустимый диапазон начала аппарата и ближайшие препятствия с двух сторон
function alongRange(u, room, layout, s){
  const L=layout||S.layout, p=L[u.key], b=bbox(u.c,p), vert=isVert(room,s), len=SIDE_LEN(room,s);
  const [a0,e0]=sideSpan(b,s,room), sz=e0-a0, perp=vert?[b.x,b.x+b.w]:[b.y,b.y+b.h];
  let lo=0, hi=len, loN=null, hiN=null;

    if(oa>=e0-0.002 && oa<hi){ hi=oa; hiN=o; } }

}
function curUnitsOf(room){ return P.units.filter(u=>P.roomOf[u.key]===room.id); }
const unitShort=u=>u?(u.c.lb2||u.c.s||shortName(u.c)):'угол';

/* ---- отрисовка цепочек: экран и печать ---- */
function dimText(x,y,txt,fs,o){ o=o||{}; const rot=o.ang!=null?` dominant-baseline="central" transform="rotate(${o.ang} ${x} ${y})"`:o.rot?` transform="rotate(-90 ${x} ${y})"`:'';
  return `<text x="${x}" y="${y}" font-size="${fs}" font-family="var(--f-mono)" text-anchor="middle" fill="${o.col||'var(--ink-2)'}" ${o.bold?'font-weight="700"':''}${rot}${o.attr?' '+o.attr:''}>${txt}</text>`; }
// px на единицу плана (1 единица = 1 см): размер подписи на экране постоянен, при увеличении влезает больше чисел
function planPxPerUnit(room){ if(typeof scrK==='number'&&scrK>0) return scrK; return (typeof kFor==='function')?kFor('plan',room.w*100+250):1; }
function equipDimsSvg(room, units, opts){
  opts=opts||{}; const print=!!opts.print, mode=print?'all':(S.planDims||'all'); if(mode==='off') return '';
  const W=room.w*100, D=room.d*100, ch=equipChains(room, units, S.layout);
  const ppu=print?1:planPxPerUnit(room), fs=print?13:11/ppu, cw=fs*0.6;   // на экране — 11 px при любом масштабе
  const col=print?'var(--ink-2)':'var(--ink-2)';
  let out='';
  const ops=roomGeom(S,room).openings, SH=s=>((typeof PT_SH==='object'&&PT_SH[s])||0)+nicheOut(room,s,ops);   // цепочка дальше от стены, если на ней метки точек или ниша
  const P2=(s,t,o)=>{ o=(o||38)+SH(s); return wallOutU(room,s,t,o); };
  const ext=(s,t)=>{ const a=28+SH(s), e=44+SH(s); return [...wallOutU(room,s,t,a), ...wallOutU(room,s,t,e)]; };   // короткие выносные — не задевают подписи дверей
  if(mode==='all'){
    for(const [s,segs] of Object.entries(ch.sides)){ if(opts.blocked&&opts.blocked.has(s)) continue;   // рядом другое помещение — цепочку не рисуем, у выбранного остаются привязки внутри
      const len=SIDE_LEN(room,s)*100, a=P2(s,0), e=P2(s,len), vert=isVert(room,s), nr=nearSide(room,s);
      out+=`<line x1="${a[0]}" y1="${a[1]}" x2="${e[0]}" y2="${e[1]}" stroke="${col}" stroke-width="1.1"/>`;
      const ticks=new Set([0,len]); segs.forEach(g=>{ ticks.add(Math.round(g.a*1000)/10); ticks.add(Math.round(g.e*1000)/10); });
      for(const t of ticks){ const x=ext(s,t), q=P2(s,t); out+=`<line x1="${x[0]}" y1="${x[1]}" x2="${x[2]}" y2="${x[3]}" stroke="${col}" stroke-width="0.9"/><line x1="${q[0]-4.5}" y1="${q[1]+4.5}" x2="${q[0]+4.5}" y2="${q[1]-4.5}" stroke="${col}" stroke-width="1.8"/>`; }
      let lvl=0;
      segs.forEach((g,i)=>{ const L0=(g.e-g.a)*100, m=(g.a+g.e)*50, txt=fmt0(((g.kind==='unit'&&g.sz)?g.sz:(g.e-g.a))*1000), need=txt.length*cw+4;
        const bold=g.kind==='unit'&&g.bold, tc=g.kind==='gap'?col:'var(--ink)';
        const attr=print?'':(g.kind==='gap'?`data-gap="${s}:${i}" style="cursor:pointer"`:`data-wid="${s}:${i}" style="cursor:help"`);
        const fits=need<=L0;
        if(!print && (!fits || ppu<0.25)) return;                 // на экране — только то, что помещается
        const ww=wallById(room,s);
        if(ww.axis===null){ const off=(fits?38+0.8*fs+2:(nr?(lvl%2?78:64):(lvl%2?84:70)))+SH(s), pos=wallOutU(room,s,m,off), ang=wallTextAngle(ww); if(!fits) lvl++;
          if(!fits){ const base=P2(s,m); out+=`<line x1="${base[0]}" y1="${base[1]}" x2="${pos[0]}" y2="${pos[1]}" stroke="${col}" stroke-width="0.7"/>`; }
          if(!print && g.kind==='gap'){ const hw=Math.max(need,24), hh=fs*1.4; out+=`<rect x="${pos[0]-hw/2}" y="${pos[1]-hh*0.8}" width="${hw}" height="${hh}" fill="transparent" transform="rotate(${ang} ${pos[0]} ${pos[1]})" ${attr}/>`; }
          out+=dimText(pos[0], pos[1], txt, fs, {ang, bold, col:tc, attr}); return; }
        let off=fits?(print?(nr?45:52):(nr?Math.max(45,38+3/ppu):Math.max(52,38+3/ppu+0.75*fs))):(nr?(lvl%2?78:64):(lvl%2?84:70)); off+=SH(s); if(!fits) lvl++;
        const pos=wallOutU(room,s,m,off);
        if(!fits){ const base=P2(s,m); out+=`<line x1="${base[0]}" y1="${base[1]}" x2="${pos[0]+(vert?(nr?6:-6):0)}" y2="${pos[1]+(vert?0:(nr?6:-12))}" stroke="${col}" stroke-width="0.7"/>`; }
        if(!print && g.kind==='gap'){ const hw=Math.max(need,24), hh=fs*1.4; out+=vert?`<rect x="${pos[0]-hh/2}" y="${pos[1]-hw/2}" width="${hh}" height="${hw}" fill="transparent" ${attr}/>`:`<rect x="${pos[0]-hw/2}" y="${pos[1]-hh*0.8}" width="${hw}" height="${hh}" fill="transparent" ${attr}/>`; }
        out+=dimText(pos[0], pos[1], txt, fs, {rot:vert, bold, col:tc, attr}); });

// изменить промежуток: сдвигается аппарат после промежутка и прижатые к нему вплотную; угловой — на месте
function applyGap(s, i, val){
  const room=S.room, ch=equipChains(room, curUnits(), S.layout), segs=ch.sides[s], g=segs[i], vert=isVert(room,s), cur=g.e-g.a;
  let delta=val-cur, run=[], dir=1;
  const len=SIDE_LEN(room,s), movable=seg=>seg&&seg.kind==='unit'&&seg.bold&&seg.a>0.01&&seg.e<len-0.01;   // угловой (в углу или боком) — на месте
  if(i<segs.length-1){ for(let j=i+1;j<segs.length && segs[j].kind==='unit';j++){ if(!movable(segs[j])) break; run.push(segs[j]); } }
  if(!run.length){ dir=-1; for(let j=i-1;j>=0 && segs[j].kind==='unit';j--){ if(!movable(segs[j])) break; run.push(segs[j]); } }
  let msg='';
  if(!run.length){ msg='Здесь нечего сдвигать: рядом угловой аппарат или угол'; openGapEditor(`${s}:${i}`, msg); return; }
  // место: следующий промежуток за цепочкой прижатых
  const lastIdx=dir>0?segs.indexOf(run[run.length-1]):segs.indexOf(run[run.length-1]);
  const nextGap=dir>0?(segs[lastIdx+1]&&segs[lastIdx+1].kind==='gap'?segs[lastIdx+1].e-segs[lastIdx+1].a:0):(segs[lastIdx-1]&&segs[lastIdx-1].kind==='gap'?segs[lastIdx-1].e-segs[lastIdx-1].a:0);
  if(delta>nextGap+1e-6){ delta=nextGap; msg=`Больше ${fmt0((cur+delta)*1000)} не получится — мешает ${(()=>{ const n=segs[dir>0?lastIdx+(segs[lastIdx+1]&&segs[lastIdx+1].kind==='gap'?2:1):lastIdx-(segs[lastIdx-1]&&segs[lastIdx-1].kind==='gap'?2:1)]; return n&&n.x?unitShort(n.x.u):'угол'; })()}`; }
  if(delta<-cur) delta=-cur;
  for(const seg of run){ const p=S.layout[seg.x.u.key], sh=dir*delta; if(vert) p.y=r3(p.y+sh); else p.x=r3(p.x+sh); }
  S.layoutManual=true; touch(); render();
  // поле остаётся открытым над тем же промежутком — с сообщением, если упёрлись
  setTimeout(()=>openGapEditor(`${s}:${i}`, msg),30);
}

function eqLabelScr(c,w,h,u){
